<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2Flow system architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f2f8fc; color: #1c1e21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #525860; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #1c1e21; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>A2Flow system architecture</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-architecture-title readme-architecture-desc">
      <title id="readme-architecture-title">A2Flow system architecture</title>
      <desc id="readme-architecture-desc">Architecture diagram of A2Flow: the frontend talks to the backend's AI agent over AG-UI/SSE, the agent clones Agent Skills and calls an LLM, and the backend's MCP gateway resolves secrets from HashiCorp Vault, writes to PostgreSQL, and routes tool calls through the MCP proxy sandbox to registered MCP servers.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Backend zone (bg -> zones -> arrows -> nodes) -->
      <rect x="240" y="180" width="480" height="148" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <rect x="252" y="184" width="88" height="12" rx="2" fill="#f2f8fc"/>
      <text x="296" y="193" fill="rgba(28,30,33,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BACKEND</text>

      <!-- Arrows -->
      <path d="M480,116 L480,132 Q480,140 472,140 L368,140 Q360,140 360,148 L360,216" fill="none" stroke="#525860" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="264" y1="260" x2="200" y2="260" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="456" y1="260" x2="496" y2="260" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M360,304 L360,352 Q360,360 352,360 L168,360 Q160,360 160,368 L160,420" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="688" y1="260" x2="760" y2="260" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M560,304 L560,352 Q560,360 552,360 L448,360 Q440,360 440,368 L440,420" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M624,304 L624,368 Q624,376 632,376 L760,376 Q768,376 768,384 L768,420" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="768" y1="484" x2="768" y2="540" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="396" y="120" width="72" height="12" rx="2" fill="#f2f8fc"/>
      <text x="432" y="129" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AG-UI, SSE</text>

      <rect x="204" y="240" width="52" height="12" rx="2" fill="#f2f8fc"/>
      <text x="230" y="249" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLONES</text>

      <rect x="172" y="388" width="44" height="12" rx="2" fill="#f2f8fc"/>
      <text x="194" y="397" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CALLS</text>

      <rect x="700" y="240" width="56" height="12" rx="2" fill="#f2f8fc"/>
      <text x="728" y="249" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SECRETS</text>

      <rect x="470" y="340" width="60" height="12" rx="2" fill="#f2f8fc"/>
      <text x="500" y="349" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">AUDIT LOG</text>

      <rect x="672" y="356" width="48" height="12" rx="2" fill="#f2f8fc"/>
      <text x="696" y="365" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CERT</text>

      <!-- Frontend -->
      <rect x="360" y="40" width="240" height="76" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="480" y="66" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Frontend</text>
      <text x="480" y="84" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">chat + admin UI</text>
      <text x="480" y="100" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">renders A2UI surfaces</text>

      <!-- AI agent (inside backend zone) -->
      <rect x="264" y="216" width="192" height="88" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="360" y="254" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">AI agent</text>
      <text x="360" y="272" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">generates &amp; runs it</text>

      <!-- MCP gateway (inside backend zone) -->
      <rect x="496" y="216" width="192" height="88" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="592" y="254" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MCP gateway</text>
      <text x="592" y="272" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">authorizes every call</text>

      <!-- Agent Skills (external) -->
      <rect x="40" y="228" width="160" height="64" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="120" y="256" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Agent Skills</text>
      <text x="120" y="272" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Git repositories</text>

      <!-- HashiCorp Vault (external) -->
      <rect x="760" y="228" width="160" height="64" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="840" y="256" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">HashiCorp Vault</text>
      <text x="840" y="272" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">secrets read live</text>

      <!-- LLM (external) -->
      <rect x="80" y="420" width="160" height="64" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="160" y="448" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">LLM</text>
      <text x="160" y="464" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Gemini, GPT, Claude</text>

      <!-- PostgreSQL (store) -->
      <rect x="340" y="420" width="200" height="64" rx="6" fill="rgba(28,30,33,0.05)" stroke="#525860" stroke-width="1"/>
      <text x="440" y="448" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="440" y="464" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">records, audit, secrets</text>

      <!-- MCP proxy -->
      <rect x="680" y="420" width="176" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="768" y="448" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MCP proxy</text>
      <text x="768" y="464" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">runs 3rd-party code</text>

      <!-- MCP servers (external) -->
      <rect x="680" y="540" width="176" height="64" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="768" y="568" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MCP servers</text>
      <text x="768" y="584" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">your tools</text>

      <!-- Legend -->
      <line x1="40" y1="632" x2="960" y2="632" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <text x="40" y="648" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="660" width="24" height="14" rx="4" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="72" y="671" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">A2Flow component</text>

      <rect x="220" y="660" width="24" height="14" rx="4" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="252" y="671" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">External system</text>

      <rect x="400" y="660" width="24" height="14" rx="4" fill="rgba(28,30,33,0.05)" stroke="#525860" stroke-width="1"/>
      <text x="432" y="671" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Data store</text>

      <rect x="540" y="660" width="24" height="14" rx="4" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <text x="572" y="671" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Trust zone</text>
    </svg>
  </div>
</body>
</html>
