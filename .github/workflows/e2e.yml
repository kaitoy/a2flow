# Runs the browser end-to-end suite in e2e/ against the real backend and a
# production frontend build. The backend's LLM is the scripted one in
# backend/scripts/e2e_server.py, so the job needs no API key and plays the same
# way every time. e2e/start.sh, launched by the runner, starts both servers.
name: E2E tests

on:
  push:
    branches: [master]
    # Repeated under pull_request rather than shared through a YAML anchor:
    # GitHub Actions does not support anchors in workflow files.
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "mise.toml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "mise.toml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mise.toml is the single source of truth for the Python, uv, Node.js,
      # and pnpm versions, here as much as on a developer's machine.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install e2e dependencies
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      # prebuild regenerates the API bindings, which runs the backend through
      # `uv run` and so also syncs backend/.venv for start.sh.
      - name: Build the frontend
        working-directory: frontend
        run: pnpm build

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Install the browser
        working-directory: e2e
        run: pnpm exec e2e-web install chromium --with-deps

      - name: Run the e2e suite
        working-directory: e2e
        env:
          E2E_TELEMETRY_DISABLED: "1"
        run: pnpm exec e2e run

      # Traces, screenshots, the JUnit report, and the app log
      # (.e2e/logs/app.log) for diagnosing a failure.
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/.e2e/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
