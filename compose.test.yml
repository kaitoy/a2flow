# Throwaway PostgreSQL for running the backend test suite against the dialect
# production actually uses. Separate from compose.yml on purpose: that file's
# `db` service owns the persistent `pgdata` volume holding a developer's real
# application data, and a test run truncates every table it can reach.
#
# Usage:
#   docker compose -f compose.test.yml up -d
#   cd backend && A2FLOW_TEST_PG_URL=postgresql+asyncpg://a2flow:a2flow@localhost:5433/a2flow_test uv run pytest
#   docker compose -f compose.test.yml down
#
# Without that variable the suite keeps running on in-memory SQLite and this
# service is not needed at all. See README.md's Testing section.
# Its own Compose project. Without this both files default to the directory
# name and their identically-named `db` services fight over one container.
name: a2flow-test

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: a2flow
      POSTGRES_PASSWORD: a2flow
      POSTGRES_DB: a2flow_test
      # A subdirectory of the tmpfs mount below, rather than the mount point
      # itself: the entrypoint creates and chowns PGDATA as root before
      # dropping to the postgres user, which it cannot do to the mount root.
      PGDATA: /var/lib/postgresql/data/pgdata
    # max_connections covers every pytest-xdist worker (half the host's cores)
    # holding a pooled engine of its own, with room to spare.
    command: >
      -c fsync=off
      -c full_page_writes=off
      -c synchronous_commit=off
      -c max_connections=300
    # Nothing here outlives the container, and durability is worthless for a
    # database that is recreated on every `up`. Paired with fsync=off above,
    # this is what keeps per-test TRUNCATE cheap.
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      # 5433, not 5432, so this never collides with a locally installed
      # PostgreSQL or with compose.yml's `db` service.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2flow -d a2flow_test"]
      interval: 3s
      timeout: 5s
      retries: 20
