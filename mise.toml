# Toolchain versions for A2Flow - the single source of truth.
# After cloning: `mise trust` then `mise install`.
#
# Kept in sync by hand with:
#   - backend/.python-version      (uv interpreter selection)
#   - frontend/package.json        ("packageManager", used by corepack in Docker)
#   - backend/Dockerfile, frontend/Dockerfile (base image tags)
[tools]
python = "3.14.9"
node = "26.12.1"
pnpm = "12.15.0"
uv = "0.13.5"
lefthook = "2.1.10"
