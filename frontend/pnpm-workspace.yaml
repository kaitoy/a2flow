allowBuilds:
  msw: true
  sharp: true

# Two transitives are pinned to an exact, vulnerable version by their parents —
# @hey-api/json-schema-ref-parser (1.4.4, the latest) pins js-yaml 4.2.0
# (GHSA-52cp-r559-cp3m / GHSA-5p4m-2wfm-xmqj / GHSA-2883-xcg3-v3hh) and
# @a2ui/markdown-it 0.1.2 pins dompurify 3.4.11 (GHSA-55q2-fjhq-7xh7 /
# GHSA-c2j3-45gr-mqc4). Drop an entry once its parent moves off the exact pin.
overrides:
  js-yaml: ^4.3.2
  dompurify: ^3.4.13

# @a2ui/markdown-it 0.2.2 (the latest) declares a peer of @a2ui/web_core
# ^0.14.0, but imports only types from it, so it runs unchanged on 0.15. Drop
# this once a markdown-it release accepts the installed web_core.
peerDependencyRules:
  allowedVersions:
    "@a2ui/markdown-it>@a2ui/web_core": "0.15"
