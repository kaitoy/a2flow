<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-execution-run-loop-dark-title workflow-execution-run-loop-dark-desc">
      <title id="workflow-execution-run-loop-dark-title">Cómo avanza la ejecución</title>
      <desc id="workflow-execution-run-loop-dark-desc">Diagrama de flujo del bucle de avance de la ejecución: listar las tareas de la ejecución, elegir una cuyas dependencias hayan terminado, marcarla en curso, hacer el trabajo, marcarla completada, fallida u omitida, y repetir, o cerrar cuando todas las tareas hayan terminado.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bf5c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <line x1="500" y1="88" x2="500" y2="112" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="208" x2="500" y2="256" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="500" y1="304" x2="500" y2="344" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="392" x2="500" y2="432" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="160" x2="720" y2="160" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M400,464 L168,464 Q160,464 160,456 L160,72 Q160,64 168,64 L400,64" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="484" y="222" width="32" height="12" rx="2" fill="#030711"/>
      <text x="500" y="231" fill="#3bf5c4" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SÍ</text>

      <rect x="658" y="154" width="24" height="12" rx="2" fill="#030711"/>
      <text x="670" y="163" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <!-- List the run's tasks -->
      <rect x="400" y="40" width="200" height="48" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="60" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Listar las tareas</text><text x="500" y="76" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">de la ejecución</text>

      <!-- Decision diamond -->
      <polygon points="500,112 620,160 500,208 380,160" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="156" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">¿Tarea pendiente con</text>
      <text x="500" y="170" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">dependencias terminadas?</text>

      <!-- Mark it in_progress -->
      <rect x="400" y="256" width="200" height="48" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="284" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Marcarla en curso</text>

      <!-- Do the work -->
      <rect x="368" y="344" width="264" height="48" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="368" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Hacer el trabajo</text>
      <text x="500" y="384" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">herramientas, aprobaciones, conversación</text>

      <!-- Mark it ended -->
      <rect x="400" y="432" width="200" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="460" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Marcarla completada,</text>
      <text x="500" y="476" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">fallida u omitida</text>

      <!-- Run settles (end oval) -->
      <rect x="720" y="136" width="200" height="48" rx="24" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="820" y="160" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">La ejecución se cierra</text>
      <text x="820" y="174" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">todas las tareas han terminado</text>

      <!-- Legend -->
      <line x1="40" y1="530" x2="960" y2="530" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="546" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEYENDA</text>

      <rect x="40" y="562" width="24" height="12" rx="2" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="72" y="572" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">Paso (rectángulo)</text>

      <polygon points="252,568 264,562 276,568 264,574" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="288" y="572" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">Decisión (rombo)</text>

      <rect x="440" y="562" width="24" height="12" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="472" y="572" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">Salida del bucle (óvalo)</text>

      <line x1="616" y1="568" x2="644" y2="568" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="652" y="572" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">Continúa el bucle</text>
    </svg>
