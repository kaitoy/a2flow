<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="admin-ui-navigation-title admin-ui-navigation-desc">
      <title id="admin-ui-navigation-title">Navegación de la interfaz de administración</title>
      <desc id="admin-ui-navigation-desc">Diagrama de flujo del modelo de navegación de la interfaz de administración: la página de bienvenida lleva a la lista de una sección, desde la que se abre un formulario de creación o, al hacer clic en un nombre, una página de detalle; la ruta de navegación de la página de detalle devuelve a la lista.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="220" y1="116" x2="280" y2="116" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="370" y1="152" x2="370" y2="220" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M460,252 L460,204 Q460,196 468,196 L672,196 Q680,196 680,188 L680,152" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="104" x2="590" y2="104" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="590" y1="128" x2="460" y2="128" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="375" y="179" width="46" height="16" rx="2" fill="#f2f8fc"/>
      <text x="398" y="191" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AÑADIR</text>

      <rect x="502" y="84" width="46" height="14" rx="2" fill="#f2f8fc"/>
      <text x="525" y="95" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOMBRE</text>

      <rect x="471" y="134" width="108" height="14" rx="2" fill="#f2f8fc"/>
      <text x="525" y="145" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">RUTA DE NAVEGACIÓN</text>

      <!-- Welcome page -->
      <rect x="40" y="80" width="180" height="72" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="130" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Página de bienvenida</text>
      <text x="130" y="130" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">tarjetas de acción rápida</text>

      <!-- Section list (focal) -->
      <rect x="280" y="80" width="180" height="72" rx="6" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="370" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Lista de la sección</text>
      <text x="370" y="130" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">p. ej., Flujos de trabajo</text>

      <!-- Create form -->
      <rect x="280" y="220" width="180" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="370" y="258" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Formulario de creación</text>

      <!-- Detail page -->
      <rect x="590" y="80" width="180" height="72" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="680" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Página de detalle</text>
      <text x="680" y="130" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">con el nombre como título</text>
    </svg>
