<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1412 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authorization-session-matrix-dark-title authorization-session-matrix-dark-desc"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style></defs>
      <title id="authorization-session-matrix-dark-title">Quién puede acceder a cada sesión</title>
      <desc id="authorization-session-matrix-dark-desc">Matriz de acceso que muestra que los Desarrolladores, el creador del flujo de trabajo y el Superadministrador acceden a una sesión de diseño, con acceso de solo lectura para los Revisores, mientras que el iniciador de la ejecución, sus aprobadores designados y el Superadministrador acceden a una sesión del flujo de trabajo, con acceso de solo lectura para el Administrador.</desc>

      <rect width="100%" height="100%" fill="#030711"/>

