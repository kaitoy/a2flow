      <text x="798" y="112" fill="#ffffff" fill-opacity="0.85" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">启动此次运行</text>

      <rect x="888" y="72" width="148" height="56" rx="6" fill="#1c1e21"/>
