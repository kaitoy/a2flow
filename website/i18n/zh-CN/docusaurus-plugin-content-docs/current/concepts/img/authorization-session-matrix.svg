<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1412 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authorization-session-matrix-title authorization-session-matrix-desc"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style></defs>
      <title id="authorization-session-matrix-title">谁可以进入哪个会话</title>
      <desc id="authorization-session-matrix-desc">访问矩阵，显示开发人员、工作流的创建者和超级管理员可以进入设计会话，审阅者对其拥有只读访问权限；运行的发起人、指定审批人和超级管理员可以进入工作流会话，管理员对工作流会话拥有只读访问权限。</desc>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Header row -->
      <rect x="12" y="72" width="208" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="116" y="98" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">会话</text>
      <text x="116" y="116" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">vs. 操作者</text>

      <rect x="232" y="72" width="148" height="56" rx="6" fill="#1c1e21"/>
      <text x="306" y="94" fill="#ffffff" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">开发人员</text>
      <text x="306" y="112" fill="#ffffff" fill-opacity="0.85" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">租户内任何人</text>

      <rect x="396" y="72" width="148" height="56" rx="6" fill="#1c1e21"/>
      <text x="470" y="94" fill="#ffffff" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">审阅者</text>
      <text x="470" y="112" fill="#ffffff" fill-opacity="0.85" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">租户内任何人</text>

      <rect x="560" y="72" width="148" height="56" rx="6" fill="#1c1e21"/>
      <text x="634" y="94" fill="#ffffff" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">创建者</text>
      <text x="634" y="112" fill="#ffffff" fill-opacity="0.85" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">工作流的创建者</text>

