      <rect x="232" y="188" width="148" height="40" rx="4" fill="#f2f8fc" stroke="#1c1e21" stroke-opacity="0.12" stroke-width="0.6"/>
      <text x="306" y="212" fill="#7d8591" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">无权访问</text>

      <rect x="396" y="188" width="148" height="40" rx="4" fill="#f2f8fc" stroke="#1c1e21" stroke-opacity="0.12" stroke-width="0.6"/>
      <text x="470" y="212" fill="#7d8591" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">无权访问</text>

