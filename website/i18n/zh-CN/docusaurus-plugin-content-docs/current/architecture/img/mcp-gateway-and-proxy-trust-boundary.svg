<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-gateway-and-proxy-trust-boundary-title mcp-gateway-and-proxy-trust-boundary-desc">
      <title id="mcp-gateway-and-proxy-trust-boundary-title">跨越信任边界</title>
      <desc id="mcp-gateway-and-proxy-trust-boundary-desc">架构图，显示 MCP 网关决定调用是否被允许、是否被模拟以及需要哪些凭据，然后把恰好一个已授权的调用跨越信任边界交给 MCP 代理服务器，由后者启动或连接真实的 MCP 服务器。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="40" y="60" width="300" height="120" rx="8" fill="#1c1e21" fill-opacity="0.02" stroke="#1c1e21" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="52" y="63" width="64" height="14" rx="2" fill="#f2f8fc"/>
      <text x="84" y="73" fill="#1c1e21" fill-opacity="0.40" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">运行代理</text>

      <rect x="400" y="60" width="240" height="120" rx="8" fill="#1c1e21" fill-opacity="0.02" stroke="#1c1e21" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="412" y="63" width="40" height="14" rx="2" fill="#f2f8fc"/>
      <text x="432" y="73" fill="#1c1e21" fill-opacity="0.40" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">沙箱</text>

      <!-- Arrows -->
      <line x1="300" y1="124" x2="440" y2="124" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="124" x2="700" y2="124" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow label -->
      <rect x="342" y="103" width="56" height="14" rx="2" fill="#f2f8fc"/>
      <text x="370" y="113" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已授权</text>

      <!-- MCP gateway -->
      <rect x="80" y="92" width="220" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="190" y="118" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">MCP 网关</text>
      <text x="190" y="134" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">允许、模拟、凭据</text>

      <!-- MCP proxy (inside sandbox zone) -->
      <rect x="440" y="92" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="520" y="118" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">MCP 代理服务器</text>
      <text x="520" y="134" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">启动或连接</text>

      <!-- MCP server (outside both zones) -->
      <rect x="700" y="92" width="160" height="64" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="780" y="118" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">MCP 服务器</text>
      <text x="780" y="134" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">不受我方控制</text>

      <!-- Legend -->
      <line x1="40" y1="204" x2="860" y2="204" stroke="#1c1e21" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="220" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">图例</text>

      <rect x="40" y="232" width="24" height="14" rx="4" fill="#1c1e21" fill-opacity="0.02" stroke="#1c1e21" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="72" y="243" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">信任边界</text>
    </svg>
