<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-design-status-dark-title workflow-design-status-dark-desc">
      <title id="workflow-design-status-dark-title">工作流状态生命周期</title>
      <desc id="workflow-design-status-dark-desc">状态机，显示工作流从已发布的代理技能开始，经过生成中到达草稿或失败，再从草稿进入已发布和已修改，并可从已修改通过发布返回已发布。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bf5c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Transitions (drawn first) -->
      <line x1="16" y1="112" x2="40" y2="112" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="200" y1="112" x2="240" y2="112" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="112" x2="440" y2="112" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M320,152 L320,178 Q320,186 328,186 L472,186 Q480,186 480,194 L480,220" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="220" x2="560" y2="152" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="112" x2="640" y2="112" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="700" y1="152" x2="700" y2="220" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="220" x2="760" y2="152" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="204" y="95" width="32" height="14" rx="2" fill="#030711"/>
      <text x="220" y="105" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">生成</text>

      <rect x="372" y="179" width="44" height="14" rx="2" fill="#030711"/>
      <text x="394" y="190" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">无步骤</text>

      <rect x="576" y="179" width="32" height="14" rx="2" fill="#030711"/>
      <text x="592" y="190" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">修订</text>

      <rect x="604" y="95" width="32" height="14" rx="2" fill="#030711"/>
      <text x="620" y="105" fill="#3bf5c4" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发布</text>

      <rect x="684" y="179" width="32" height="14" rx="2" fill="#030711"/>
      <text x="700" y="190" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">编辑</text>

      <rect x="744" y="179" width="32" height="14" rx="2" fill="#030711"/>
      <text x="760" y="190" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">发布</text>

      <!-- Start dot -->
      <circle cx="10" cy="112" r="6" fill="#e3e3e3"/>

      <!-- Agent Skill (precondition, dashed) -->
      <rect x="40" y="72" width="160" height="80" rx="8" fill="#e3e3e3" fill-opacity="0.02" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="120" y="108" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">代理技能</text>
      <text x="120" y="124" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已发布的修订版本</text>

      <!-- generating -->
      <rect x="240" y="72" width="160" height="80" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="320" y="108" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">生成中</text>
      <text x="320" y="124" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">设计运行进行中</text>

      <!-- draft -->
      <rect x="440" y="72" width="160" height="80" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="520" y="108" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">草稿</text>
      <text x="520" y="124" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">模板 + 绑定</text>

      <!-- published (focal) -->
      <rect x="640" y="72" width="160" height="80" rx="8" fill="#3bf5c4" fill-opacity="0.10" stroke="#3bf5c4" stroke-width="1"/>
      <text x="720" y="108" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已发布</text>
      <text x="720" y="124" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">设计已冻结</text>

      <!-- failed -->
      <rect x="440" y="220" width="160" height="80" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="520" y="256" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">失败</text>
      <text x="520" y="272" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已记录原因</text>

      <!-- modified -->
      <rect x="640" y="220" width="160" height="80" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="720" y="256" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已修改</text>
      <text x="720" y="272" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">运行使用已发布版本</text>

      <!-- Legend -->
      <line x1="40" y1="340" x2="960" y2="340" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="356" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">图例</text>

      <rect x="40" y="368" width="24" height="14" rx="8" fill="#e3e3e3" fill-opacity="0.02" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="76" y="379" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">前提条件</text>

      <rect x="220" y="368" width="24" height="14" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="256" y="379" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">状态</text>

      <rect x="360" y="368" width="24" height="14" rx="8" fill="#3bf5c4" fill-opacity="0.10" stroke="#3bf5c4" stroke-width="1"/>
      <text x="396" y="379" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">实际运行的版本</text>
    </svg>
