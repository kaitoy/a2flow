<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scaling-lock-race-dark-title scaling-lock-race-dark-desc">
      <title id="scaling-lock-race-dark-title">每个对话一个驱动方</title>
      <desc id="scaling-lock-race-dark-desc">两个副本争相运行同一会话的时序图：副本 1 获取 PostgreSQL 咨询锁并为客户端 A 打开流；在锁被持有期间，副本 2 收到的同一会话的后续请求被以 409 拒绝；只有当副本 1 的流结束时，锁才会释放。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bf5c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Lifelines -->
      <line x1="110" y1="128" x2="110" y2="600" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="330" y1="128" x2="330" y2="600" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="550" y1="128" x2="550" y2="600" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="770" y1="128" x2="770" y2="600" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="990" y1="128" x2="990" y2="600" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Messages -->
      <line x1="110" y1="160" x2="330" y2="160" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="330" y1="204" x2="550" y2="204" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="550" y1="248" x2="330" y2="248" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="330" y1="292" x2="110" y2="292" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="990" y1="336" x2="770" y2="336" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="770" y1="380" x2="550" y2="380" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="550" y1="424" x2="770" y2="424" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="770" y1="468" x2="990" y2="468" stroke="#3bf5c4" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <line x1="330" y1="512" x2="110" y2="512" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="330" y1="556" x2="550" y2="556" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="173" y="144" width="94" height="12" rx="2" fill="#030711"/>
      <text x="220" y="153" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">POST /AGENT</text>

      <rect x="418" y="187" width="44" height="14" rx="2" fill="#030711"/>
      <text x="440" y="197" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">获取锁</text>

      <rect x="418" y="231" width="44" height="14" rx="2" fill="#030711"/>
      <text x="440" y="241" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已获取</text>

      <rect x="178" y="275" width="84" height="14" rx="2" fill="#030711"/>
      <text x="220" y="285" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">SSE 流打开</text>

      <rect x="833" y="320" width="94" height="12" rx="2" fill="#030711"/>
      <text x="880" y="329" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">POST /AGENT</text>

      <rect x="638" y="363" width="44" height="14" rx="2" fill="#030711"/>
      <text x="660" y="373" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">获取锁</text>

      <rect x="620" y="407" width="80" height="14" rx="2" fill="#030711"/>
      <text x="660" y="417" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已被他处持有</text>

      <rect x="846" y="451" width="68" height="14" rx="2" fill="#030711"/>
      <text x="880" y="461" fill="#3bf5c4" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">409 拒绝</text>

      <rect x="198" y="495" width="44" height="14" rx="2" fill="#030711"/>
      <text x="220" y="505" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">流结束</text>

      <rect x="412" y="539" width="56" height="14" rx="2" fill="#030711"/>
      <text x="440" y="549" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">锁已释放</text>

      <!-- Actor boxes -->
      <rect x="38" y="72" width="144" height="56" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="110" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">客户端 A</text>

      <rect x="258" y="72" width="144" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="330" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">副本 1</text>

      <rect x="478" y="72" width="144" height="56" rx="6" fill="#3bf5c4" fill-opacity="0.10" stroke="#3bf5c4" stroke-width="1"/>
      <text x="550" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">PostgreSQL</text>

      <rect x="698" y="72" width="144" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="770" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">副本 2</text>

      <rect x="918" y="72" width="144" height="56" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="990" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">客户端 B</text>

      <!-- Legend -->
      <line x1="38" y1="620" x2="1062" y2="620" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="38" y="636" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">图例</text>

      <line x1="38" y1="660" x2="66" y2="660" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="74" y="663" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">调用</text>

      <line x1="160" y1="660" x2="188" y2="660" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="196" y="663" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">返回</text>

      <line x1="300" y1="660" x2="328" y2="660" stroke="#3bf5c4" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="336" y="663" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">已拒绝</text>
    </svg>
