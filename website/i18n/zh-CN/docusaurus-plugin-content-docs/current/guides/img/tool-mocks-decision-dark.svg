<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tool-mocks-decision-dark-title tool-mocks-decision-dark-desc">
      <title id="tool-mocks-decision-dark-title">工具模拟的拦截位置</title>
      <desc id="tool-mocks-decision-dark-desc">流程图：代理调用工具时，检查此次运行是否模拟了该工具，然后要么访问真实的 MCP 服务器，要么不联系任何服务器、直接收到模拟的下一个响应。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bf5c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <line x1="360" y1="84" x2="360" y2="112" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="450" y1="168" x2="520" y2="168" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="224" x2="360" y2="268" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="472" y="147" width="20" height="16" rx="2" fill="#030711"/>
      <text x="482" y="159" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">否</text>

      <rect x="382" y="235" width="20" height="16" rx="2" fill="#030711"/>
      <text x="392" y="247" fill="#3bf5c4" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">是</text>

      <!-- The agent -->
      <rect x="260" y="20" width="200" height="64" rx="28" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="360" y="50" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">代理</text>
      <text x="360" y="70" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">调用工具</text>

      <!-- Decision -->
      <polygon points="360,112 450,168 360,224 270,168" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="360" y="164" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">此次运行</text>
      <text x="360" y="178" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">是否模拟？</text>

      <!-- MCP server -->
      <rect x="520" y="136" width="200" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="620" y="166" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">MCP 服务器</text>
      <text x="620" y="186" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">真实副作用</text>

      <!-- Mock's next response (focal) -->
      <rect x="260" y="268" width="200" height="72" rx="28" fill="#3bf5c4" fill-opacity="0.10" stroke="#3bf5c4" stroke-width="1"/>
      <text x="360" y="298" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">模拟的下一个响应</text>
      <text x="360" y="318" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">不联系任何服务器</text>

      <!-- Legend -->
      <line x1="40" y1="356" x2="720" y2="356" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="372" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">图例</text>

      <rect x="40" y="384" width="24" height="12" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="72" y="394" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">开始 / 结束</text>

      <polygon points="212,390 224,384 236,390 224,396" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="248" y="394" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">判断</text>
    </svg>
