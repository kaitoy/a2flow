<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-executions-layout-title workflow-executions-layout-desc">
      <title id="workflow-executions-layout-title">工作流会话界面</title>
      <desc id="workflow-executions-layout-desc">流程图，展示工作流会话界面的布局：任务时间线与按任务分组的消息并排显示，消息下方通向聊天输入框。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="240" y1="114" x2="300" y2="114" stroke="#525860" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="500" y1="114" x2="560" y2="114" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Task timeline -->
      <rect x="40" y="80" width="200" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="140" y="107" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">任务时间线</text>
      <text x="140" y="126" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">位于左侧，可折叠</text>

      <!-- Messages -->
      <rect x="300" y="80" width="200" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="400" y="107" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">消息</text>
      <text x="400" y="126" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">按任务分组</text>

      <!-- Chat input -->
      <rect x="560" y="80" width="160" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="640" y="120" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">聊天输入框</text>
    </svg>
