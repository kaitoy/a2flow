<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-executions-status-dark-title workflow-executions-status-dark-desc">
      <title id="workflow-executions-status-dark-title">运行状态</title>
      <desc id="workflow-executions-status-dark-desc">状态机图：运行以“运行中”开始，只等待某个时间时变为“已计划”，恢复后回到“运行中”；所有任务结束且无失败时定为“已完成”，所有任务结束且至少有一个失败时定为“失败”。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <line x1="360" y1="30" x2="360" y2="52" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M330,116 L330,144 Q330,152 322,152 L238,152 Q230,152 230,160 L230,200" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M390,116 L390,144 Q390,152 398,152 L482,152 Q490,152 490,160 L490,200" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="450" y1="74" x2="558" y2="74" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="96" x2="452" y2="96" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="460" y="67" width="90" height="14" rx="2" fill="#030711"/>
      <text x="505" y="78" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">等待某个时间</text>

      <rect x="475" y="89" width="60" height="14" rx="2" fill="#030711"/>
      <text x="505" y="100" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">恢复</text>
      <rect x="258" y="129" width="44" height="16" rx="2" fill="#030711"/>
      <text x="280" y="141" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">无失败</text>

      <rect x="400" y="129" width="80" height="16" rx="2" fill="#030711"/>
      <text x="440" y="141" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">至少一个失败</text>

      <!-- Start -->
      <circle cx="360" cy="26" r="6" fill="#e3e3e3"/>

      <!-- running (focal) -->
      <rect x="270" y="52" width="180" height="64" rx="8" fill="#3bf5c4" fill-opacity="0.10" stroke="#3bf5c4" stroke-width="1"/>
      <text x="360" y="91" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">运行中</text>

      <!-- scheduled -->
      <rect x="560" y="52" width="180" height="64" rx="8" fill="#242526" stroke="#9aa1ab" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="650" y="91" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已计划</text>

      <!-- completed -->
      <rect x="140" y="200" width="180" height="56" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="230" y="235" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已完成</text>

      <!-- failed -->
      <rect x="400" y="200" width="180" height="56" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="490" y="235" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">失败</text>
    </svg>
