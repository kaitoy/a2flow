<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="approvals-step-coverage-title approvals-step-coverage-desc">
      <title id="approvals-step-coverage-title">승인 하나가 다루는 범위</title>
      <desc id="approvals-step-coverage-desc">승인 A가 처음 세 단계를 다루고 승인 B가 네 번째 단계부터 이어받는 5단계 작업 체인의 순서도. 승인은 자신이 지정한 단계와 다음 승인 전까지 그 뒤의 모든 단계를 다룹니다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="120" y1="88" x2="120" y2="140" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="200" y1="168" x2="220" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="168" x2="400" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="168" x2="580" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="660" y1="88" x2="660" y2="140" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="168" x2="760" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Gates -->
      <rect x="40" y="40" width="160" height="48" rx="24" fill="#1c1e21" fill-opacity="0.02" stroke="#1c1e21" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="120" y="60" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">승인 A</text>
      <text x="120" y="76" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">게이트</text>

      <rect x="580" y="40" width="160" height="48" rx="24" fill="#1c1e21" fill-opacity="0.02" stroke="#1c1e21" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="660" y="60" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">승인 B</text>
      <text x="660" y="76" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">게이트</text>

      <!-- Steps -->
      <rect x="40" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="120" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">승인 요청</text>

      <rect x="220" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="300" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">인스턴스 시작</text>

      <rect x="400" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="480" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">인스턴스 태그 지정</text>

      <rect x="580" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="660" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">다시 요청</text>

      <rect x="760" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="840" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">스냅샷 삭제</text>

      <!-- Coverage brackets -->
      <path d="M40,208 L40,214 L560,214 L560,208" fill="none" stroke="#00877a" stroke-width="1.2"/>
      <text x="300" y="230" fill="#00877a" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">승인 A가 다루는 범위</text>

      <path d="M580,208 L580,214 L920,214 L920,208" fill="none" stroke="#00877a" stroke-width="1.2"/>
      <text x="750" y="230" fill="#00877a" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">승인 B가 다루는 범위</text>

      <!-- Legend -->
      <line x1="40" y1="256" x2="960" y2="256" stroke="#1c1e21" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="272" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">범례</text>

      <rect x="40" y="284" width="24" height="14" rx="7" fill="#1c1e21" fill-opacity="0.02" stroke="#1c1e21" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="76" y="295" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">승인 게이트</text>
    </svg>
