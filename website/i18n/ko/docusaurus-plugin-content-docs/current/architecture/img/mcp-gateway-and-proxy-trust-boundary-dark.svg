<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-gateway-and-proxy-trust-boundary-dark-title mcp-gateway-and-proxy-trust-boundary-dark-desc">
      <title id="mcp-gateway-and-proxy-trust-boundary-dark-title">신뢰 경계 넘기</title>
      <desc id="mcp-gateway-and-proxy-trust-boundary-dark-desc">호출의 허용 여부, 모의 여부, 필요한 자격 증명을 결정하는 MCP 게이트웨이가 권한이 부여된 호출 정확히 하나를 신뢰 경계 너머의 MCP 프록시로 넘기고, MCP 프록시가 실제 MCP 서버를 시작하거나 연결하는 것을 보여 주는 아키텍처 다이어그램.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="40" y="60" width="300" height="120" rx="8" fill="#e3e3e3" fill-opacity="0.02" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="52" y="63" width="112" height="14" rx="2" fill="#030711"/>
      <text x="108" y="73" fill="#e3e3e3" fill-opacity="0.40" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">에이전트가 실행되는 쪽</text>

      <rect x="400" y="60" width="240" height="120" rx="8" fill="#e3e3e3" fill-opacity="0.02" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="412" y="63" width="64" height="14" rx="2" fill="#030711"/>
      <text x="444" y="73" fill="#e3e3e3" fill-opacity="0.40" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">샌드박스</text>

      <!-- Arrows -->
      <line x1="300" y1="124" x2="440" y2="124" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="124" x2="700" y2="124" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow label -->
      <rect x="340" y="103" width="60" height="14" rx="2" fill="#030711"/>
      <text x="370" y="113" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">권한 부여</text>

      <!-- MCP gateway -->
      <rect x="80" y="92" width="220" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="190" y="118" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">MCP 게이트웨이</text>
      <text x="190" y="134" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">허용, 모의, 자격 증명 결정</text>

      <!-- MCP proxy (inside sandbox zone) -->
      <rect x="440" y="92" width="160" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="520" y="118" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">MCP 프록시</text>
      <text x="520" y="134" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">시작 또는 연결</text>

      <!-- MCP server (outside both zones) -->
      <rect x="700" y="92" width="160" height="64" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="780" y="118" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">MCP 서버</text>
      <text x="780" y="134" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">관리 범위 밖</text>

      <!-- Legend -->
      <line x1="40" y1="204" x2="860" y2="204" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="220" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">범례</text>

      <rect x="40" y="232" width="24" height="14" rx="4" fill="#e3e3e3" fill-opacity="0.02" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="72" y="243" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">신뢰 경계</text>
    </svg>
