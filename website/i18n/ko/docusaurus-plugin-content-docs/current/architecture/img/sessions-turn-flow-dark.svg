<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sessions-turn-flow-dark-title sessions-turn-flow-dark-desc">
      <title id="sessions-turn-flow-dark-title">한 턴의 진행 방식</title>
      <desc id="sessions-turn-flow-dark-desc">채팅 한 턴의 시퀀스 다이어그램. 사용자의 메시지가 프런트엔드에서 백엔드를 거쳐 모델로 전달되고, 모델의 스트리밍 응답과 render_a2ui 화면 요소가 돌아오며, 사용자가 채운 화면 요소가 같은 경로를 다시 왕복합니다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bf5c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Lifelines: User 128, Frontend 352, Backend 584, Model 800 -->
      <line x1="128" y1="128" x2="128" y2="568" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="352" y1="128" x2="352" y2="568" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="584" y1="128" x2="584" y2="568" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="568" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Messages -->
      <line x1="128" y1="176" x2="352" y2="176" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="352" y1="216" x2="584" y2="216" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="584" y1="256" x2="800" y2="256" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="296" x2="584" y2="296" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="584" y1="336" x2="352" y2="336" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="352" y1="376" x2="128" y2="376" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="128" y1="416" x2="352" y2="416" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="352" y1="456" x2="584" y2="456" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="584" y1="496" x2="800" y2="496" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="536" x2="352" y2="536" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="204" y="159" width="72" height="14" rx="2" fill="#030711"/>
      <text x="240" y="170" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">메시지 작성</text>

      <rect x="406" y="199" width="124" height="14" rx="2" fill="#030711"/>
      <text x="468" y="210" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">메시지 + 도구 스키마</text>

      <rect x="644" y="239" width="96" height="14" rx="2" fill="#030711"/>
      <text x="692" y="250" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">에이전트로 연결</text>

      <rect x="637" y="279" width="110" height="14" rx="2" fill="#030711"/>
      <text x="692" y="290" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">텍스트 + 도구 호출</text>

      <rect x="420" y="319" width="96" height="14" rx="2" fill="#030711"/>
      <text x="468" y="330" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">그대로 스트리밍</text>

      <rect x="196" y="359" width="88" height="14" rx="2" fill="#030711"/>
      <text x="240" y="370" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">화면 요소 표시</text>

      <rect x="202" y="399" width="76" height="14" rx="2" fill="#030711"/>
      <text x="240" y="410" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">입력 후 제출</text>

      <rect x="418" y="439" width="100" height="14" rx="2" fill="#030711"/>
      <text x="468" y="450" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">전체 데이터 모델</text>

      <rect x="654" y="479" width="76" height="14" rx="2" fill="#030711"/>
      <text x="692" y="490" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">호출과 대조</text>

      <rect x="420" y="519" width="96" height="14" rx="2" fill="#030711"/>
      <text x="468" y="530" fill="#3bf5c4" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">사용자에게 응답</text>

      <!-- Editorial callout: render_a2ui is forwarded, not executed. Placed in the
           clear margin right of the Model lifeline so it never crosses an arrow. -->
      <path d="M 900 180 Q 852 180 800 292" fill="none" stroke="#e3e3e3" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="800" cy="296" r="2" fill="#e3e3e3"/>
      <text x="980" y="152" fill="#e3e3e3" font-size="16" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">render_a2ui 호출은</text>
      <text x="980" y="170" fill="#e3e3e3" font-size="16" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="end">실행되지 않고 전달됨</text>

      <!-- Actor boxes -->
      <rect x="56" y="72" width="144" height="56" rx="6" fill="#9aa1ab" fill-opacity="0.10" stroke="#7e8794" stroke-width="1"/>
      <rect x="64" y="80" width="28" height="12" rx="2" fill="none" stroke="#7e8794" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="78" y="89" fill="#7e8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="128" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">사용자</text>
      <text x="128" y="119" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">브라우저</text>

      <rect x="280" y="72" width="144" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <rect x="288" y="80" width="30" height="12" rx="2" fill="none" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="303" y="89" fill="#9aa1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="352" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">프런트엔드</text>
      <text x="352" y="119" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">chat UI</text>

      <rect x="512" y="72" width="144" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <rect x="520" y="80" width="28" height="12" rx="2" fill="none" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="534" y="89" fill="#9aa1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="584" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">백엔드</text>
      <text x="584" y="119" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI</text>

      <rect x="728" y="72" width="144" height="56" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="736" y="80" width="28" height="12" rx="2" fill="none" stroke="#e3e3e3" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="750" y="89" fill="#9aa1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="800" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">모델</text>
      <text x="800" y="119" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">LLM provider</text>

      <!-- Legend -->
      <line x1="56" y1="600" x2="944" y2="600" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="56" y="616" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">범례</text>

      <line x1="56" y1="640" x2="84" y2="640" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="92" y="643" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">호출</text>

      <line x1="180" y1="640" x2="208" y2="640" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="216" y="643" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">스트리밍 반환</text>

      <line x1="360" y1="640" x2="388" y2="640" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="396" y="643" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">사용자 응답</text>
    </svg>
