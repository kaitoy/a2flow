<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authorization-effective-roles-title authorization-effective-roles-desc">
      <title id="authorization-effective-roles-title">유효 역할 결정</title>
      <desc id="authorization-effective-roles-desc">사용자 레코드에 직접 부여된 역할과 사용자 그룹에서 상속된 역할이 모두 사용자의 유효 역할로 모이며, 이 합집합을 모든 권한 검사가 사용한다는 것을 보여 주는 순서도.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <path d="M240,74 L272,74 Q280,74 280,82 L280,115 Q280,123 288,123 L320,123" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M240,194 L272,194 Q280,194 280,186 L280,153 Q280,145 288,145 L320,145" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="134" x2="600" y2="134" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="264" y="82" width="32" height="15" rx="2" fill="#f2f8fc"/>
      <text x="280" y="92" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">직접</text>

      <rect x="264" y="177" width="32" height="15" rx="2" fill="#f2f8fc"/>
      <text x="280" y="187" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">그룹</text>

      <!-- Direct grants -->
      <rect x="40" y="40" width="200" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="140" y="69" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">직접 부여</text>
      <text x="140" y="88" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">사용자 레코드에 부여</text>

      <!-- Group grants -->
      <rect x="40" y="160" width="200" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="140" y="189" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">그룹 부여</text>
      <text x="140" y="208" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">상속</text>

      <!-- Effective roles (focal) -->
      <rect x="320" y="100" width="200" height="68" rx="6" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="420" y="139" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">유효 역할</text>

      <!-- Every auth check -->
      <rect x="600" y="100" width="200" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="700" y="128" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">모든</text>
      <text x="700" y="146" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">권한 검사</text>
    </svg>
