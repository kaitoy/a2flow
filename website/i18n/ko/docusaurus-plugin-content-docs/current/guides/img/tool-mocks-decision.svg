<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tool-mocks-decision-title tool-mocks-decision-desc">
      <title id="tool-mocks-decision-title">도구 모의가 개입하는 위치</title>
      <desc id="tool-mocks-decision-desc">에이전트가 도구를 호출하면 이 실행에서 모의된 도구인지 확인한 뒤, 실제 MCP 서버에 연결하거나 서버에 연결하지 않고 모의의 다음 응답을 받는 과정을 보여 주는 순서도.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="360" y1="84" x2="360" y2="112" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="450" y1="168" x2="520" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="224" x2="360" y2="268" stroke="#00877a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="460" y="147" width="44" height="16" rx="2" fill="#f2f8fc"/>
      <text x="482" y="159" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">아니요</text>

      <rect x="380" y="235" width="24" height="16" rx="2" fill="#f2f8fc"/>
      <text x="392" y="247" fill="#00877a" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">예</text>

      <!-- The agent -->
      <rect x="260" y="20" width="200" height="64" rx="28" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="360" y="50" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">에이전트</text>
      <text x="360" y="70" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">도구 호출</text>

      <!-- Decision -->
      <polygon points="360,112 450,168 360,224 270,168" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="360" y="164" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">이 실행에서</text>
      <text x="360" y="178" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">모의된 도구인가?</text>

      <!-- MCP server -->
      <rect x="520" y="136" width="200" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="620" y="166" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">MCP 서버</text>
      <text x="620" y="186" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">실제 부작용</text>

      <!-- Mock's next response (focal) -->
      <rect x="260" y="268" width="200" height="72" rx="28" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="360" y="298" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">모의의 다음 응답</text>
      <text x="360" y="318" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">서버에 연결하지 않음</text>

      <!-- Legend -->
      <line x1="40" y1="356" x2="720" y2="356" stroke="#1c1e21" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="372" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">범례</text>

      <rect x="40" y="384" width="24" height="12" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="72" y="394" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">시작 / 종료</text>

      <polygon points="212,390 224,384 236,390 224,396" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="248" y="394" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">판단</text>
    </svg>
