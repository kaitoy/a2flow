<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="admin-ui-navigation-title admin-ui-navigation-desc">
      <title id="admin-ui-navigation-title">관리 UI 탐색</title>
      <desc id="admin-ui-navigation-desc">관리 UI 탐색 모델의 순서도. 환영 페이지에서 섹션 목록으로 이동하고, 목록에서 만들기 양식을 열거나 이름을 클릭해 상세 페이지를 열며, 상세 페이지의 이동 경로로 목록에 돌아갑니다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="220" y1="116" x2="280" y2="116" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="370" y1="152" x2="370" y2="220" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M460,252 L460,204 Q460,196 468,196 L652,196 Q660,196 660,188 L660,152" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="104" x2="560" y2="104" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="128" x2="460" y2="128" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="376" y="179" width="44" height="16" rx="2" fill="#f2f8fc"/>
      <text x="398" y="191" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">만들기</text>

      <rect x="482" y="83" width="60" height="16" rx="2" fill="#f2f8fc"/>
      <text x="512" y="95" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">이름 클릭</text>

      <rect x="482" y="133" width="60" height="16" rx="2" fill="#f2f8fc"/>
      <text x="512" y="145" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">이동 경로</text>

      <!-- Welcome page -->
      <rect x="40" y="80" width="180" height="72" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="130" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">환영 페이지</text>
      <text x="130" y="130" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">바로 가기 카드</text>

      <!-- Section list (focal) -->
      <rect x="280" y="80" width="180" height="72" rx="6" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="370" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">섹션 목록</text>
      <text x="370" y="130" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">예: 워크플로</text>

      <!-- Create form -->
      <rect x="280" y="220" width="180" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="370" y="258" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">만들기 양식</text>

      <!-- Detail page -->
      <rect x="560" y="80" width="200" height="72" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="660" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">상세 페이지</text>
      <text x="660" y="130" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">레코드 이름이 제목</text>
    </svg>
