<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-skills-lifecycle-title agent-skills-lifecycle-desc">
      <title id="agent-skills-lifecycle-title">에이전트 스킬 수명 주기</title>
      <desc id="agent-skills-lifecycle-desc">에이전트 스킬의 상태 머신. 등록된 스킬은 백그라운드에서 복제되어 준비됨 또는 실패 상태가 되고, 어느 상태에서든 풀로 다시 시도할 수 있으며, 준비됨 상태의 스킬에서 새 워크플로를 생성합니다.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="200" y1="108" x2="240" y2="108" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="108" x2="440" y2="108" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="144" x2="300" y2="220" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="220" x2="360" y2="144" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M520,72 L520,48 Q520,40 512,40 L328,40 Q320,40 320,48 L320,72" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="144" x2="520" y2="220" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="384" y="175" width="24" height="16" rx="2" fill="#f2f8fc"/>
      <text x="396" y="187" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">풀</text>

      <rect x="408" y="17" width="24" height="16" rx="2" fill="#f2f8fc"/>
      <text x="420" y="29" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">풀</text>

      <rect x="550" y="175" width="32" height="16" rx="2" fill="#f2f8fc"/>
      <text x="566" y="187" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">생성</text>

      <!-- Register -->
      <rect x="40" y="72" width="160" height="72" rx="24" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="120" y="102" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">등록</text>
      <text x="120" y="122" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">양식은 바로 반환</text>

      <!-- Cloning -->
      <rect x="240" y="72" width="160" height="72" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="320" y="102" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">복제 중</text>
      <text x="320" y="122" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">백그라운드에서 처리</text>

      <!-- ready (focal) -->
      <rect x="440" y="72" width="160" height="72" rx="8" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="520" y="102" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">준비됨</text>
      <text x="520" y="122" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">리비전 게시됨</text>

      <!-- failed -->
      <rect x="240" y="220" width="160" height="72" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="320" y="250" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">실패</text>
      <text x="320" y="270" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">사유가 레코드에 남음</text>

      <!-- New workflow -->
      <rect x="440" y="220" width="160" height="56" rx="24" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="520" y="253" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">새 워크플로</text>
    </svg>
