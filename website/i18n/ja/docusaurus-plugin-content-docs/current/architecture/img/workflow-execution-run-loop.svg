<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-execution-run-loop-title workflow-execution-run-loop-desc">
      <title id="workflow-execution-run-loop-title">実行の進み方</title>
      <desc id="workflow-execution-run-loop-desc">タスクを進めるループのフローチャート。タスクを一覧し、依存が完了したものを選んで in_progress にし、作業して終了状態にする。全タスクが終わって実行が確定するまでこれを繰り返す。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="500" y1="88" x2="500" y2="112" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="208" x2="500" y2="256" stroke="#00877a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="500" y1="304" x2="500" y2="344" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="392" x2="500" y2="432" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="160" x2="720" y2="160" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M400,464 L168,464 Q160,464 160,456 L160,72 Q160,64 168,64 L400,64" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="484" y="221" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="500" y="231" fill="#00877a" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ある</text>

      <rect x="640" y="153" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="656" y="163" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ない</text>

      <!-- List the run's tasks -->
      <rect x="400" y="40" width="200" height="48" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="68" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実行のタスクを一覧する</text>

      <!-- Decision diamond -->
      <polygon points="500,112 600,160 500,208 400,160" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="156" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">依存が完了した</text>
      <text x="500" y="170" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">pending タスクは?</text>

      <!-- Mark it in_progress -->
      <rect x="400" y="256" width="200" height="48" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="284" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">in_progress にする</text>

      <!-- Do the work -->
      <rect x="400" y="344" width="200" height="48" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="368" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">作業する</text>
      <text x="500" y="384" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ツール、承認、会話</text>

      <!-- Mark it ended -->
      <rect x="400" y="432" width="200" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="460" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">completed、failed、</text>
      <text x="500" y="476" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">skipped のいずれかにする</text>

      <!-- Run settles (end oval) -->
      <rect x="720" y="136" width="200" height="48" rx="24" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="820" y="160" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実行が確定する</text>
      <text x="820" y="174" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">全タスクが終わった</text>

      <!-- Legend -->
      <line x1="40" y1="530" x2="960" y2="530" stroke="#1c1e21" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="546" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">凡例</text>

      <rect x="40" y="562" width="24" height="12" rx="2" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="72" y="572" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">ステップ(長方形)</text>

      <polygon points="252,568 264,562 276,568 264,574" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="288" y="572" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">判断(ひし形)</text>

      <rect x="440" y="562" width="24" height="12" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="472" y="572" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">ループの出口(楕円)</text>

      <line x1="616" y1="568" x2="644" y2="568" stroke="#00877a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="652" y="572" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">ループを続ける</text>
    </svg>
