<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sessions-turn-flow-dark-title sessions-turn-flow-dark-desc">
      <title id="sessions-turn-flow-dark-title">1 ターンの流れ</title>
      <desc id="sessions-turn-flow-dark-desc">チャット 1 ターンのシーケンス図。ユーザーのメッセージがフロントエンド、バックエンド、モデルへ渡り、モデルのストリーム応答と render_a2ui のサーフェスが戻ってきて、ユーザーが埋めたサーフェスが同じ往復をもう一度する。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bf5c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Lifelines: User 128, Frontend 352, Backend 584, Model 800 -->
      <line x1="128" y1="128" x2="128" y2="568" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="352" y1="128" x2="352" y2="568" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="584" y1="128" x2="584" y2="568" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="800" y1="128" x2="800" y2="568" stroke="#e3e3e3" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Messages -->
      <line x1="128" y1="176" x2="352" y2="176" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="352" y1="216" x2="584" y2="216" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="584" y1="256" x2="800" y2="256" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="296" x2="584" y2="296" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="584" y1="336" x2="352" y2="336" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="352" y1="376" x2="128" y2="376" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="128" y1="416" x2="352" y2="416" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="352" y1="456" x2="584" y2="456" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="584" y1="496" x2="800" y2="496" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="536" x2="352" y2="536" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="188" y="159" width="104" height="14" rx="2" fill="#030711"/>
      <text x="240" y="170" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">メッセージを書く</text>

      <rect x="384" y="199" width="168" height="14" rx="2" fill="#030711"/>
      <text x="468" y="210" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">メッセージ + ツールスキーマ</text>

      <rect x="612" y="239" width="160" height="14" rx="2" fill="#030711"/>
      <text x="692" y="250" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ADK エージェントへ橋渡し</text>

      <rect x="614" y="279" width="156" height="14" rx="2" fill="#030711"/>
      <text x="692" y="290" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">テキスト + ツール呼び出し</text>

      <rect x="428" y="319" width="80" height="14" rx="2" fill="#030711"/>
      <text x="468" y="330" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">そのまま流す</text>

      <rect x="188" y="359" width="104" height="14" rx="2" fill="#030711"/>
      <text x="240" y="370" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">サーフェスを描く</text>

      <rect x="206" y="399" width="68" height="14" rx="2" fill="#030711"/>
      <text x="240" y="410" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">埋めて送信</text>

      <rect x="416" y="439" width="104" height="14" rx="2" fill="#030711"/>
      <text x="468" y="450" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">データモデル全体</text>

      <rect x="628" y="479" width="128" height="14" rx="2" fill="#030711"/>
      <text x="692" y="490" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">呼び出しと突き合わせ</text>

      <rect x="422" y="519" width="92" height="14" rx="2" fill="#030711"/>
      <text x="468" y="530" fill="#3bf5c4" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ユーザーに応答</text>

      <!-- Editorial callout: render_a2ui is forwarded, not executed. Placed in the
           clear margin right of the Model lifeline so it never crosses an arrow. -->
      <path d="M 900 180 Q 852 180 800 292" fill="none" stroke="#e3e3e3" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="800" cy="296" r="2" fill="#e3e3e3"/>
      <text x="980" y="152" fill="#e3e3e3" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">render_a2ui の呼び出しは</text>
      <text x="980" y="170" fill="#e3e3e3" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">実行されず転送される</text>

      <!-- Actor boxes -->
      <rect x="56" y="72" width="144" height="56" rx="6" fill="#9aa1ab" fill-opacity="0.10" stroke="#7e8794" stroke-width="1"/>
      <rect x="64" y="80" width="28" height="12" rx="2" fill="none" stroke="#7e8794" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="78" y="89" fill="#7e8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="128" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ユーザー</text>
      <text x="128" y="119" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ブラウザ</text>

      <rect x="280" y="72" width="144" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <rect x="288" y="80" width="30" height="12" rx="2" fill="none" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="303" y="89" fill="#9aa1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="352" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">フロントエンド</text>
      <text x="352" y="119" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js UI</text>

      <rect x="512" y="72" width="144" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <rect x="520" y="80" width="28" height="12" rx="2" fill="none" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="534" y="89" fill="#9aa1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="584" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">バックエンド</text>
      <text x="584" y="119" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI</text>

      <rect x="728" y="72" width="144" height="56" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="736" y="80" width="28" height="12" rx="2" fill="none" stroke="#e3e3e3" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="750" y="89" fill="#9aa1ab" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="800" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">モデル</text>
      <text x="800" y="119" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">Google ADK</text>

      <!-- Legend -->
      <line x1="56" y1="600" x2="944" y2="600" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="56" y="616" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">凡例</text>

      <line x1="56" y1="640" x2="84" y2="640" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="92" y="643" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">呼び出し</text>

      <line x1="180" y1="640" x2="208" y2="640" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="216" y="643" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">ストリーム返答</text>

      <line x1="360" y1="640" x2="388" y2="640" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="396" y="643" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">ユーザーへの応答</text>
    </svg>
