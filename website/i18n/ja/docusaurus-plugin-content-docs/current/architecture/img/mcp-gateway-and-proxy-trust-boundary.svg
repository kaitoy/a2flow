<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-gateway-and-proxy-trust-boundary-title mcp-gateway-and-proxy-trust-boundary-desc">
      <title id="mcp-gateway-and-proxy-trust-boundary-title">信頼境界を越える</title>
      <desc id="mcp-gateway-and-proxy-trust-boundary-desc">呼び出しを許可するか、モックするか、どの資格情報が要るかを決める MCP ゲートウェイが、認可済みの呼び出しをちょうど 1 件だけ信頼境界を越えて MCP プロキシに渡し、MCP プロキシが本物の MCP サーバーを起動または接続することを示すアーキテクチャ図。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="40" y="60" width="300" height="120" rx="8" fill="#1c1e21" fill-opacity="0.02" stroke="#1c1e21" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="52" y="63" width="128" height="14" rx="2" fill="#f2f8fc"/>
      <text x="116" y="73" fill="#1c1e21" fill-opacity="0.40" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">エージェントが動く側</text>

      <rect x="400" y="60" width="240" height="120" rx="8" fill="#1c1e21" fill-opacity="0.02" stroke="#1c1e21" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="412" y="63" width="92" height="14" rx="2" fill="#f2f8fc"/>
      <text x="458" y="73" fill="#1c1e21" fill-opacity="0.40" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">サンドボックス</text>

      <!-- Arrows -->
      <line x1="300" y1="124" x2="440" y2="124" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="124" x2="700" y2="124" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow label -->
      <rect x="342" y="103" width="56" height="14" rx="2" fill="#f2f8fc"/>
      <text x="370" y="113" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">認可済み</text>

      <!-- MCP gateway -->
      <rect x="80" y="92" width="220" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="190" y="118" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP ゲートウェイ</text>
      <text x="190" y="134" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">許可・モック・資格情報を決める</text>

      <!-- MCP proxy (inside sandbox zone) -->
      <rect x="440" y="92" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="520" y="118" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP プロキシ</text>
      <text x="520" y="134" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">起動または接続</text>

      <!-- MCP server (outside both zones) -->
      <rect x="700" y="92" width="160" height="64" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="780" y="118" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP サーバー</text>
      <text x="780" y="134" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">管理の外にある</text>

      <!-- Legend -->
      <line x1="40" y1="204" x2="860" y2="204" stroke="#1c1e21" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="220" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">凡例</text>

      <rect x="40" y="232" width="24" height="14" rx="4" fill="#1c1e21" fill-opacity="0.02" stroke="#1c1e21" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="72" y="243" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">信頼境界</text>
    </svg>
