<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="approvals-sequence-title approvals-sequence-desc">
      <title id="approvals-sequence-title">承認ゲートの動き</title>
      <desc id="approvals-sequence-desc">承認のシーケンス図。実行エージェントが承認を依頼し、対象のステップが止まったまま A2Flow が承認者に通知する。承認者が決定すると、A2Flow は対象の各ステップに開始時に証明書を渡し、実行を続けさせる。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Lifelines -->
      <line x1="130" y1="128" x2="130" y2="380" stroke="#1c1e21" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="430" y1="128" x2="430" y2="380" stroke="#1c1e21" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="128" x2="700" y2="380" stroke="#1c1e21" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Messages -->
      <line x1="130" y1="176" x2="430" y2="176" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="430" y1="236" x2="700" y2="236" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="296" x2="430" y2="296" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="430" y1="356" x2="130" y2="356" stroke="#00877a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="246" y="159" width="68" height="14" rx="2" fill="#f2f8fc"/>
      <text x="280" y="170" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">承認を依頼</text>

      <rect x="549" y="219" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="565" y="230" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">通知</text>

      <rect x="549" y="279" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="565" y="290" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">決定</text>

      <rect x="246" y="339" width="68" height="14" rx="2" fill="#f2f8fc"/>
      <text x="280" y="350" fill="#00877a" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実行が続く</text>

      <!-- Editorial callouts, kept clear of the lifelines and each other -->
      <path d="M 900 182 Q 852 182 700 228" fill="none" stroke="#1c1e21" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="700" cy="236" r="2" fill="#1c1e21"/>
      <text x="960" y="152" fill="#1c1e21" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">対象のステップは</text>
      <text x="960" y="170" fill="#1c1e21" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">止まったまま</text>

      <path d="M 900 262 Q 852 262 700 288" fill="none" stroke="#1c1e21" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="700" cy="296" r="2" fill="#1c1e21"/>
      <text x="960" y="232" fill="#1c1e21" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">ステップごとに</text>
      <text x="960" y="250" fill="#1c1e21" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">証明書が渡される</text>

      <!-- Actor boxes -->
      <rect x="58" y="72" width="144" height="56" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="130" y="98" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実行</text>
      <text x="130" y="113" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">エージェント</text>

      <rect x="358" y="72" width="144" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="430" y="104" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">A2Flow</text>

      <rect x="628" y="72" width="144" height="56" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="700" y="104" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">承認者</text>

      <!-- Legend -->
      <line x1="58" y1="400" x2="944" y2="400" stroke="#1c1e21" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="58" y="416" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">凡例</text>

      <line x1="58" y1="440" x2="86" y2="440" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="94" y="443" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">呼び出し</text>

      <line x1="180" y1="440" x2="208" y2="440" stroke="#00877a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="216" y="443" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">実行の続行</text>
    </svg>
