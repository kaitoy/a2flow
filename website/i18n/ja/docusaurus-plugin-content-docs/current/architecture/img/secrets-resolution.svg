<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secrets-resolution-title secrets-resolution-desc">
      <title id="secrets-resolution-title">シークレット参照の解決</title>
      <desc id="secrets-resolution-desc">name/key のシークレット参照が保管の型で分岐することを示すフローチャート。local のシークレットは保管された値を復号し、Vault のシークレットはその場で読み、どちらも MCP サーバーへの接続かスキルのリポジトリのクローンに使われる。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows (behind nodes) -->
      <line x1="500" y1="88" x2="500" y2="128" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M400,180 L258,180 Q250,180 250,188 L250,272" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M600,180 L742,180 Q750,180 750,188 L750,272" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M250,328 L250,352 Q250,360 258,360 L448,360 Q456,360 456,368 L456,392" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M750,328 L750,352 Q750,360 742,360 L552,360 Q544,360 544,368 L544,392" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Branch labels -->
      <rect x="305" y="160" width="48" height="12" rx="2" fill="#f2f8fc"/>
      <text x="329" y="169" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">LOCAL</text>

      <rect x="647" y="160" width="48" height="12" rx="2" fill="#f2f8fc"/>
      <text x="671" y="169" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">VAULT</text>

      <!-- R: reference (start oval) -->
      <rect x="400" y="40" width="200" height="48" rx="24" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="500" y="64" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">参照</text>
      <text x="500" y="78" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">name/key</text>

      <!-- V: decision diamond -->
      <polygon points="500,132 600,180 500,228 400,180" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="184" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">どちらの型か</text>

      <!-- L: local -->
      <rect x="160" y="272" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="250" y="298" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">保管された値を</text>
      <text x="250" y="314" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">復号する</text>

      <!-- H: vault -->
      <rect x="660" y="272" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="750" y="298" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">Vault から</text>
      <text x="750" y="314" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">その場で読む</text>

      <!-- U: consumer (end oval) -->
      <rect x="368" y="392" width="264" height="56" rx="28" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="500" y="416" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP サーバーへの接続</text>
      <text x="500" y="432" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">またはスキルのリポジトリのクローン</text>
    </svg>
