<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-gateway-and-proxy-policy-chain-title mcp-gateway-and-proxy-policy-chain-desc">
      <title id="mcp-gateway-and-proxy-policy-chain-title">ポリシーチェーン</title>
      <desc id="mcp-gateway-and-proxy-policy-chain-desc">MCP ゲートウェイがツール呼び出しをどう裁くかを示すフローチャート。ポリシーチェーンが拒否するか許可し、許可された呼び出しはモックが応答するか、資格情報の展開と MCP プロキシを経て本物の MCP サーバーに届く。拒否も本物の呼び出しも監査の記録を残す。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="500" y1="88" x2="500" y2="104" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="160" x2="680" y2="160" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="216" x2="500" y2="264" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="608" y1="320" x2="820" y2="320" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="376" x2="500" y2="416" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="464" x2="500" y2="512" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="560" x2="500" y2="608" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,656 L500,704" fill="none" stroke="#00877a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M760,188 L760,672 Q760,680 752,680 L568,680 Q560,680 560,688 L560,704" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="624" y="139" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="640" y="149" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">拒否</text>

      <rect x="524" y="233" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="540" y="243" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">許可</text>

      <rect x="698" y="299" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="714" y="309" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">はい</text>

      <rect x="500" y="389" width="44" height="14" rx="2" fill="#f2f8fc"/>
      <text x="522" y="399" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">いいえ</text>

      <!-- A: start oval -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="500" y="60" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実行エージェント</text>
      <text x="500" y="74" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ツールを呼ぶ</text>

      <!-- C: decision diamond -->
      <polygon points="500,104 600,160 500,216 400,160" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="164" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ポリシーチェーン</text>

      <!-- R: refused (end oval) -->
      <rect x="680" y="132" width="160" height="56" rx="28" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="760" y="156" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">拒否</text>
      <text x="760" y="170" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">使えるツールの一覧が返る</text>

      <!-- K: decision diamond -->
      <polygon points="500,264 608,320 500,376 392,320" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="316" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">この実行で</text>
      <text x="500" y="330" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">モックされている?</text>

      <!-- MO: mock response (end oval) -->
      <rect x="820" y="292" width="160" height="56" rx="28" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="900" y="316" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">モックの次の応答</text>
      <text x="900" y="330" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">サーバーには届かない</text>

      <!-- I: credential injection -->
      <rect x="400" y="416" width="200" height="48" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="444" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">資格情報の展開</text>

      <!-- X: MCP proxy -->
      <rect x="420" y="512" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="540" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP プロキシ</text>

      <!-- S: MCP server -->
      <rect x="420" y="608" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="636" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP サーバー</text>

      <!-- AU: audit record (focal end oval) -->
      <rect x="410" y="704" width="180" height="56" rx="28" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="500" y="738" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">監査の記録</text>
    </svg>
