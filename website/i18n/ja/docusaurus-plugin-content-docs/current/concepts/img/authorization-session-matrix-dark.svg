      <title id="authorization-session-matrix-dark-title">誰がどのセッションに入れるか</title>
      <desc id="authorization-session-matrix-dark-desc">開発者、ワークフローの作成者、スーパー管理者が設計セッションに入れ、実行の開始者、指名された承認者、スーパー管理者がワークフローセッションに入れること、そして管理者はワークフローセッションを読み取りのみできることを示すアクセスマトリクス。</desc>

