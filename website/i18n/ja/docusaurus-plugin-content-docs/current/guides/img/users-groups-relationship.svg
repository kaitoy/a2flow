<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="users-groups-relationship-title users-groups-relationship-desc">
      <title id="users-groups-relationship-title">テナント、ユーザー、グループ</title>
      <desc id="users-groups-relationship-desc">テナントがユーザーとユーザーグループを含み、メンバーシップでユーザーがグループに属し、ユーザー自身のロールとグループのロールの両方が実効ロールになることを示すフローチャート。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="220" y1="94" x2="320" y2="94" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="130" y1="128" x2="130" y2="220" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M170,220 L170,196 Q170,188 178,188 L362,188 Q370,188 370,180 L370,128" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="410" y1="128" x2="410" y2="220" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="220" y1="254" x2="320" y2="254" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="224" y="165" width="92" height="16" rx="2" fill="#f2f8fc"/>
      <text x="270" y="177" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">メンバーシップ</text>

      <rect x="420" y="161" width="44" height="16" rx="2" fill="#f2f8fc"/>
      <text x="442" y="173" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ロール</text>

      <rect x="244" y="231" width="44" height="16" rx="2" fill="#f2f8fc"/>
      <text x="266" y="243" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ロール</text>

      <!-- Tenant -->
      <rect x="40" y="60" width="180" height="68" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="130" y="89" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">テナント</text>
      <text x="130" y="108" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">組織の境界</text>

      <!-- User Group -->
      <rect x="40" y="220" width="180" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="130" y="249" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ユーザーグループ</text>
      <text x="130" y="268" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">名前つきの束</text>

      <!-- User -->
      <rect x="320" y="60" width="180" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="410" y="89" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ユーザー</text>
      <text x="410" y="108" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">1 つのアカウント</text>

      <!-- Effective roles (focal) -->
      <rect x="320" y="220" width="200" height="68" rx="6" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="420" y="258" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実効ロール</text>
    </svg>
