<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflows-status-title workflows-status-desc">
      <title id="workflows-status-title">ワークフローの詳細ステータス</title>
      <desc id="workflows-status-desc">ワークフローの詳細ステータスの状態遷移図。generating から draft か failed になり、failed は書き直して draft に戻せる。draft は公開すると published になり、published と modified は編集と公開で行き来し、どちらも Deactivate で draft に戻る。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="20" y1="92" x2="60" y2="92" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="220" y1="92" x2="280" y2="92" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M140,124 L140,172 Q140,180 148,180 L242,180 Q250,180 250,188 L250,220" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M290,220 L290,180 Q290,172 298,172 L352,172 Q360,172 360,164 L360,124" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="92" x2="500" y2="92" stroke="#00877a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="660" y1="76" x2="720" y2="76" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="108" x2="660" y2="108" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M580,124 L580,312 Q580,320 572,320 L388,320 Q380,320 380,312 L380,124" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M800,124 L800,332 Q800,340 792,340 L436,340 Q428,340 428,332 L428,328 a8,8 0 0,0 0,-16 L428,124" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="175" y="161" width="40" height="16" rx="2" fill="#f2f8fc"/>
      <text x="195" y="173" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">失敗</text>

      <rect x="303" y="153" width="44" height="16" rx="2" fill="#f2f8fc"/>
      <text x="325" y="165" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">手動で</text>

      <rect x="445" y="70" width="50" height="14" rx="2" fill="#f2f8fc"/>
      <text x="470" y="81" fill="#00877a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>

      <rect x="670" y="53" width="40" height="16" rx="2" fill="#f2f8fc"/>
      <text x="690" y="65" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">編集</text>

      <rect x="663" y="116" width="54" height="14" rx="2" fill="#f2f8fc"/>
      <text x="690" y="125" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">PUBLISH</text>

      <rect x="445" y="302" width="70" height="14" rx="2" fill="#f2f8fc"/>
      <text x="480" y="313" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">DEACTIVATE</text>

      <rect x="579" y="322" width="70" height="14" rx="2" fill="#f2f8fc"/>
      <text x="614" y="333" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">DEACTIVATE</text>

      <!-- Start -->
      <circle cx="16" cy="92" r="6" fill="#1c1e21"/>

      <!-- generating -->
      <rect x="60" y="60" width="160" height="64" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="140" y="99" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">generating</text>

      <!-- draft -->
      <rect x="280" y="60" width="160" height="64" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="360" y="99" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">draft</text>

      <!-- published (focal) -->
      <rect x="500" y="60" width="160" height="64" rx="8" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="580" y="99" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">published</text>

      <!-- modified -->
      <rect x="720" y="60" width="160" height="64" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="800" y="99" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">modified</text>

      <!-- failed -->
      <rect x="170" y="220" width="160" height="64" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="250" y="259" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">failed</text>
    </svg>
