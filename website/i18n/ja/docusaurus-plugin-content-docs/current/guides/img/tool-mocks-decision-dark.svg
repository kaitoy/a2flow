<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tool-mocks-decision-dark-title tool-mocks-decision-dark-desc">
      <title id="tool-mocks-decision-dark-title">ツールモックが割り込む場所</title>
      <desc id="tool-mocks-decision-dark-desc">エージェントがツールを呼ぶと、この実行でモックされているかを確認し、本物の MCP サーバーに届くか、どのサーバーにも接続せずモックの次のレスポンスを受け取るかを示すフローチャート。</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bf5c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <line x1="360" y1="84" x2="360" y2="112" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="450" y1="168" x2="520" y2="168" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="224" x2="360" y2="268" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="460" y="147" width="44" height="16" rx="2" fill="#030711"/>
      <text x="482" y="159" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">いいえ</text>

      <rect x="376" y="235" width="32" height="16" rx="2" fill="#030711"/>
      <text x="392" y="247" fill="#3bf5c4" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">はい</text>

      <!-- The agent -->
      <rect x="260" y="20" width="200" height="64" rx="28" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="360" y="50" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">エージェント</text>
      <text x="360" y="70" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ツールを呼ぶ</text>

      <!-- Decision -->
      <polygon points="360,112 450,168 360,224 270,168" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="360" y="164" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">この実行で</text>
      <text x="360" y="178" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">モックされている?</text>

      <!-- MCP server -->
      <rect x="520" y="136" width="200" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="620" y="166" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP サーバー</text>
      <text x="620" y="186" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">本物の副作用</text>

      <!-- Mock's next response (focal) -->
      <rect x="260" y="268" width="200" height="72" rx="28" fill="#3bf5c4" fill-opacity="0.10" stroke="#3bf5c4" stroke-width="1"/>
      <text x="360" y="298" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">モックの次のレスポンス</text>
      <text x="360" y="318" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">サーバーには接続しない</text>

      <!-- Legend -->
      <line x1="40" y1="356" x2="720" y2="356" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="372" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">凡例</text>

      <rect x="40" y="384" width="24" height="12" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="72" y="394" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">開始 / 終了</text>

      <polygon points="212,390 224,384 236,390 224,396" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="248" y="394" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">判断</text>
    </svg>
