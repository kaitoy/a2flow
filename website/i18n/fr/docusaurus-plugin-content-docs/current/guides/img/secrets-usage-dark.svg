<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secrets-usage-dark-title secrets-usage-dark-desc">
      <title id="secrets-usage-dark-title">Où une entrée de secret est utilisée</title>
      <desc id="secrets-usage-dark-desc">Organigramme montrant l'entrée d'un secret référencée dans les en-têtes et variables d'environnement d'un serveur MCP, comme mot de passe d'authentification du dépôt d'une compétence d'agent, comme secret client de l'authentification unique d'un tenant ou comme clé d'API du LLM d'un tenant.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows: one trunk from the entry, branching to each consumer -->
      <line x1="200" y1="266" x2="260" y2="266" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420,266 L448,266 Q456,266 456,258 L456,64 Q456,56 464,56 L480,56" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420,266 L448,266 Q456,266 456,258 L456,204 Q456,196 464,196 L480,196" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420,266 L448,266 Q456,266 456,274 L456,328 Q456,336 464,336 L480,336" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420,266 L448,266 Q456,266 456,274 L456,468 Q456,476 464,476 L480,476" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Secret -->
      <rect x="40" y="230" width="160" height="72" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="120" y="260" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Secret</text>
      <text x="120" y="280" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">name</text>

      <!-- Entry (focal) -->
      <rect x="260" y="230" width="160" height="72" rx="6" fill="#3bf5c4" fill-opacity="0.10" stroke="#3bf5c4" stroke-width="1"/>
      <text x="340" y="260" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Entrée</text>
      <text x="340" y="280" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">key</text>

      <!-- MCP server headers/env -->
      <rect x="480" y="20" width="260" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="610" y="50" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Serveur MCP</text>
      <text x="610" y="70" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">en-têtes + variables d'environnement</text>

      <!-- Agent Skill auth -->
      <rect x="480" y="160" width="260" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="610" y="190" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Compétence d'agent</text>
      <text x="610" y="210" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">mot de passe d'authentification du dépôt</text>

      <!-- Tenant single sign-on -->
      <rect x="480" y="300" width="260" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="610" y="330" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Authentification unique</text>
      <text x="610" y="350" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">secret client</text>

      <!-- Tenant LLM -->
      <rect x="480" y="440" width="260" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="610" y="470" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">LLM du tenant</text>
      <text x="610" y="490" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">clé d'API</text>
    </svg>
