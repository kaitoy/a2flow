<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-topology-dark-title deployment-topology-dark-desc">
      <title id="deployment-topology-dark-title">Topologie de déploiement</title>
      <desc id="deployment-topology-dark-desc">Schéma d'architecture montrant le navigateur qui atteint un proxy inverse, lequel achemine les requêtes d'API (/api/*) directement vers l'API du backend et les requêtes de pages vers le frontend, et l'API du backend, qui exécute aussi le worker d'e-mails, qui atteint l'état durable (base de données, magasin de compétences, clé secrète), les services externes (fournisseur de LLM, serveurs MCP) et un relais SMTP.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="40" y="480" width="360" height="120" rx="8" fill="#e3e3e3" fill-opacity="0.02" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="52" y="484" width="112" height="12" rx="2" fill="#030711"/>
      <text x="108" y="493" fill="#e3e3e3" fill-opacity="0.40" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ÉTAT DURABLE</text>

      <rect x="440" y="480" width="280" height="120" rx="8" fill="#e3e3e3" fill-opacity="0.02" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="452" y="484" width="128" height="12" rx="2" fill="#030711"/>
      <text x="516" y="493" fill="#e3e3e3" fill-opacity="0.40" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICES EXTERNES</text>

      <!-- Arrows -->
      <line x1="500" y1="96" x2="500" y2="136" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="192" x2="500" y2="336" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M620,164 L812,164 Q820,164 820,172 L820,232" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M440,408 L440,436 Q440,444 432,444 L228,444 Q220,444 220,452 L220,480" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,408 L500,436 Q500,444 508,444 L572,444 Q580,444 580,452 L580,480" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M560,408 L560,420 Q560,428 568,428 L852,428 Q860,428 860,436 L860,512" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Label -->
      <rect x="474" y="108" width="52" height="12" rx="2" fill="#030711"/>
      <text x="500" y="117" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">HTTPS</text>
      <rect x="470" y="258" width="60" height="12" rx="2" fill="#030711"/>
      <text x="500" y="267" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">/api/*</text>
      <rect x="690" y="158" width="52" height="12" rx="2" fill="#030711"/>
      <text x="716" y="167" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">pages</text>

      <!-- Browser (external) -->
      <rect x="380" y="40" width="240" height="56" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="500" y="74" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Navigateur</text>

      <!-- Reverse proxy -->
      <rect x="380" y="136" width="240" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="160" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Proxy inverse</text>
      <text x="500" y="176" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">répartiteur de charge</text>

      <!-- Frontend -->
      <rect x="700" y="232" width="240" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="820" y="260" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Frontend</text>
      <text x="820" y="276" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">interface de discussion</text>

      <!-- Backend API (focal — folds in the email worker) -->
      <rect x="380" y="336" width="240" height="72" rx="6" fill="#3bf5c4" fill-opacity="0.10" stroke="#3bf5c4" stroke-width="1"/>
      <text x="500" y="366" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">API du backend</text>
      <text x="500" y="382" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">uvicorn + worker d'e-mails</text>

      <!-- Durable state: Database, Skill store, Secret key -->
      <rect x="60" y="512" width="100" height="72" rx="6" fill="#e3e3e3" fill-opacity="0.08" stroke="#9aa1ab" stroke-width="1"/>
      <text x="110" y="542" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle"><tspan x="110" dy="-11">Base de</tspan><tspan x="110" dy="16">données</tspan></text>
      <text x="110" y="566" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">enregistrements</text>

      <rect x="170" y="512" width="100" height="72" rx="6" fill="#e3e3e3" fill-opacity="0.08" stroke="#9aa1ab" stroke-width="1"/>
      <text x="220" y="542" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle"><tspan x="220" dy="-11">Magasin de</tspan><tspan x="220" dy="16">compétences</tspan></text>
      <text x="220" y="566" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dépôts clonés</text>

      <rect x="280" y="512" width="100" height="72" rx="6" fill="#e3e3e3" fill-opacity="0.08" stroke="#9aa1ab" stroke-width="1"/>
      <text x="330" y="542" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle"><tspan x="330" dy="-11">Clé</tspan><tspan x="330" dy="16">secrète</tspan></text>
      <text x="330" y="566" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chiffre</text>

      <!-- External services: LLM provider, MCP servers -->
      <rect x="460" y="512" width="110" height="72" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="515" y="552" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle"><tspan x="515" dy="-8">Fournisseur</tspan><tspan x="515" dy="16">de LLM</tspan></text>

      <rect x="590" y="512" width="110" height="72" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="645" y="552" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Serveurs MCP</text>

      <!-- SMTP relay (external) -->
      <rect x="780" y="512" width="160" height="72" rx="6" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="860" y="552" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Relais SMTP</text>

      <!-- Legend -->
      <line x1="40" y1="632" x2="960" y2="632" stroke="#e3e3e3" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="648" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LÉGENDE</text>

      <rect x="40" y="660" width="24" height="14" rx="4" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="72" y="671" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">Composant A2Flow</text>

      <rect x="220" y="660" width="24" height="14" rx="4" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="252" y="671" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">Système externe</text>

      <rect x="400" y="660" width="24" height="14" rx="4" fill="#e3e3e3" fill-opacity="0.08" stroke="#9aa1ab" stroke-width="1"/>
      <text x="432" y="671" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">Magasin de données</text>
    </svg>
