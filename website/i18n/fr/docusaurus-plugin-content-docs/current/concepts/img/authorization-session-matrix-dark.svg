<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1412 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authorization-session-matrix-dark-title authorization-session-matrix-dark-desc"><defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style></defs>
      <title id="authorization-session-matrix-dark-title">Qui accède à quelle session</title>
      <desc id="authorization-session-matrix-dark-desc">Matrice d'accès montrant que les Développeurs, le créateur du workflow et le Super administrateur accèdent à une session de conception, les Relecteurs y ayant un accès en lecture seule, tandis que l'initiateur de l'exécution, ses approbateurs désignés et le Super administrateur accèdent à une session du workflow, l'Administrateur y ayant un accès en lecture seule.</desc>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Header row -->
      <rect x="12" y="72" width="208" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="116" y="98" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Session</text>
      <text x="116" y="116" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">selon l'acteur</text>

      <rect x="232" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="306" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Développeur</text>
      <text x="306" y="112" fill="#e3e3e3" fill-opacity="0.85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tous dans le tenant</text>

      <rect x="396" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="470" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Relecteur</text>
      <text x="470" y="112" fill="#e3e3e3" fill-opacity="0.85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tous dans le tenant</text>

      <rect x="560" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="634" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Créateur</text>
      <text x="634" y="112" fill="#e3e3e3" fill-opacity="0.85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">« Créé par » du workflow</text>

      <rect x="724" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="798" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Initiateur</text>
