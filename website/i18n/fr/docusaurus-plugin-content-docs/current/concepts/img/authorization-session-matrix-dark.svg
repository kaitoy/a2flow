      <rect x="888" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="962" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Approbateur</text>
      <text x="962" y="112" fill="#e3e3e3" fill-opacity="0.85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">désigné pour celle-ci</text>

