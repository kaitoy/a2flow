<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 740 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secrets-usage-title secrets-usage-desc">
      <title id="secrets-usage-title">Where a secret entry is used</title>
      <desc id="secrets-usage-desc">Flowchart showing a secret's entry referenced either in an MCP server's headers and environment variables, or as an Agent Skill repository's auth password.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="200" y1="116" x2="260" y2="116" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420,104 L448,104 Q456,104 456,96 L456,64 Q456,56 464,56 L480,56" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420,128 L448,128 Q456,128 456,136 L456,188 Q456,196 464,196 L480,196" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="423" y="56" width="54" height="14" rx="2" fill="#f2f8fc"/>
      <text x="450" y="67" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">HEADERS</text>

      <rect x="430" y="164" width="40" height="14" rx="2" fill="#f2f8fc"/>
      <text x="450" y="175" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AUTH</text>

      <!-- Secret -->
      <rect x="40" y="80" width="160" height="72" rx="6" fill="#1c1e21" fill-opacity="0.03" stroke="#1c1e21" stroke-opacity="0.30" stroke-width="1"/>
      <text x="120" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Secret</text>
      <text x="120" y="130" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">name</text>

      <!-- Entry (focal) -->
      <rect x="260" y="80" width="160" height="72" rx="6" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="340" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Entry</text>
      <text x="340" y="130" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">key</text>

      <!-- MCP server headers/env -->
      <rect x="480" y="20" width="220" height="72" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="590" y="50" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MCP server</text>
      <text x="590" y="70" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">headers + env vars</text>

      <!-- Agent Skill auth -->
      <rect x="480" y="160" width="220" height="72" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="590" y="190" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Agent Skill</text>
      <text x="590" y="210" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">repo auth password</text>
    </svg>
