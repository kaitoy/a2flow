<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-skills-lifecycle-dark-title agent-skills-lifecycle-dark-desc">
      <title id="agent-skills-lifecycle-dark-title">Agent Skill lifecycle</title>
      <desc id="agent-skills-lifecycle-dark-desc">State machine showing an Agent Skill registered, cloning in the background, becoming ready or failed, pulling to retry from either state, and a ready skill generating a new workflow.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <line x1="200" y1="108" x2="240" y2="108" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="108" x2="440" y2="108" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="144" x2="300" y2="220" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="220" x2="360" y2="144" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M520,72 L520,48 Q520,40 512,40 L328,40 Q320,40 320,48 L320,72" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="144" x2="520" y2="220" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="376" y="176" width="40" height="14" rx="2" fill="#030711"/>
      <text x="396" y="187" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">PULL</text>

      <rect x="394" y="18" width="52" height="14" rx="2" fill="#030711"/>
      <text x="420" y="29" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">PULL</text>

      <rect x="534" y="176" width="64" height="14" rx="2" fill="#030711"/>
      <text x="566" y="187" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GENERATE</text>

      <!-- Register -->
      <rect x="40" y="72" width="160" height="72" rx="24" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="120" y="102" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Register</text>
      <text x="120" y="122" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">returns immediately</text>

      <!-- Cloning -->
      <rect x="240" y="72" width="160" height="72" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="320" y="102" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Cloning</text>
      <text x="320" y="122" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">in the background</text>

      <!-- ready (focal) -->
      <rect x="440" y="72" width="160" height="72" rx="8" fill="#3bf5c4" fill-opacity="0.10" stroke="#3bf5c4" stroke-width="1"/>
      <text x="520" y="102" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">ready</text>
      <text x="520" y="122" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">revision published</text>

      <!-- failed -->
      <rect x="240" y="220" width="160" height="72" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="320" y="250" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">failed</text>
      <text x="320" y="270" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">reason on record</text>

      <!-- New workflow -->
      <rect x="440" y="220" width="160" height="56" rx="24" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="520" y="253" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">New workflow</text>
    </svg>
