<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 540 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflows-snapshot-title workflows-snapshot-desc">
      <title id="workflows-snapshot-title">Running a workflow makes a snapshot</title>
      <desc id="workflows-snapshot-desc">Flowchart showing the published Workflow and its chosen tool mocks copied by value onto a new Workflow execution snapshot, which opens a Workflow session.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <path d="M160,108 L160,140 Q160,148 168,148 L240,148 Q248,148 248,156 L248,160" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M400,108 L400,140 Q400,148 392,148 L320,148 Q312,148 312,156 L312,160" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="228" x2="280" y2="280" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="174" y="126" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="190" y="137" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">RUN</text>

      <rect x="328" y="126" width="68" height="14" rx="2" fill="#f2f8fc"/>
      <text x="362" y="137" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">COPIED</text>

      <!-- Workflow -->
      <rect x="60" y="40" width="200" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="160" y="67" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Workflow</text>
      <text x="160" y="86" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">published version</text>

      <!-- Chosen tool mocks -->
      <rect x="300" y="40" width="200" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="400" y="82" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Chosen tool mocks</text>

      <!-- Workflow execution (focal) -->
      <rect x="180" y="160" width="200" height="68" rx="6" fill="#00877a" fill-opacity="0.08" stroke="#00877a" stroke-width="1"/>
      <text x="280" y="187" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Workflow execution</text>
      <text x="280" y="206" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">the snapshot</text>

      <!-- Workflow session -->
      <rect x="180" y="280" width="200" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="280" y="314" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Workflow session</text>
    </svg>
