<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secrets-resolution-dark-title secrets-resolution-dark-desc">
      <title id="secrets-resolution-dark-title">Secret reference resolution</title>
      <desc id="secrets-resolution-dark-desc">Flowchart showing a name/key secret reference branching by storage type: local secrets are decrypted from the stored value, Vault secrets are read live, and both feed an MCP server connection or a skill repository clone.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows (behind nodes) -->
      <line x1="500" y1="88" x2="500" y2="128" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M400,180 L258,180 Q250,180 250,188 L250,272" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M600,180 L742,180 Q750,180 750,188 L750,272" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M250,328 L250,352 Q250,360 258,360 L448,360 Q456,360 456,368 L456,392" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M750,328 L750,352 Q750,360 742,360 L552,360 Q544,360 544,368 L544,392" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Branch labels -->
      <rect x="305" y="160" width="48" height="12" rx="2" fill="#030711"/>
      <text x="329" y="169" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">LOCAL</text>

      <rect x="647" y="160" width="48" height="12" rx="2" fill="#030711"/>
      <text x="671" y="169" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">VAULT</text>

      <!-- R: reference (start oval) -->
      <rect x="400" y="40" width="200" height="48" rx="24" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="500" y="64" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">A reference</text>
      <text x="500" y="78" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">name/key</text>

      <!-- V: decision diamond -->
      <polygon points="500,132 600,180 500,228 400,180" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="184" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Which type?</text>

      <!-- L: local -->
      <rect x="160" y="272" width="180" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="250" y="298" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Decrypt the</text>
      <text x="250" y="314" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">stored value</text>

      <!-- H: vault -->
      <rect x="660" y="272" width="180" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="750" y="298" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Read it live</text>
      <text x="750" y="314" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">from Vault</text>

      <!-- U: consumer (end oval) -->
      <rect x="368" y="392" width="264" height="56" rx="28" fill="#e3e3e3" fill-opacity="0.03" stroke="#e3e3e3" stroke-opacity="0.30" stroke-width="1"/>
      <text x="500" y="416" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MCP server connection</text>
      <text x="500" y="432" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">or a skill repository clone</text>
    </svg>
