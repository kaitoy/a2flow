<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワークフローセッションの画面</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f2f8fc; color: #1c1e21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #525860; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #1c1e21; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>ワークフローセッションの画面</h1>

    <svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-executions-layout-title workflow-executions-layout-desc">
      <title id="workflow-executions-layout-title">ワークフローセッションの画面</title>
      <desc id="workflow-executions-layout-desc">ワークフローセッションの画面レイアウトを示すフローチャート。タスクタイムラインと、タスクごとにまとまったメッセージが横に並び、メッセージの先にチャット入力がある。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="240" y1="114" x2="300" y2="114" stroke="#525860" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <line x1="500" y1="114" x2="560" y2="114" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Task timeline -->
      <rect x="40" y="80" width="200" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="140" y="107" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">タスクタイムライン</text>
      <text x="140" y="126" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">左端。折りたためる</text>

      <!-- Messages -->
      <rect x="300" y="80" width="200" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="400" y="107" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">メッセージ</text>
      <text x="400" y="126" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">タスクごとにまとまる</text>

      <!-- Chat input -->
      <rect x="560" y="80" width="160" height="68" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="640" y="120" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">チャット入力</text>
    </svg>
  </div>
</body>
</html>
