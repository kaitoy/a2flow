<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理 UI のナビゲーション</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f2f8fc; color: #1c1e21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #525860; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #1c1e21; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>管理 UI のナビゲーション</h1>

    <svg viewBox="0 0 800 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="admin-ui-navigation-title admin-ui-navigation-desc">
      <title id="admin-ui-navigation-title">管理 UI のナビゲーション</title>
      <desc id="admin-ui-navigation-desc">管理 UI のナビゲーションモデルのフローチャート。ようこそページからセクションの一覧へ進み、一覧からは新規作成フォームか、名前をクリックして詳細ページを開く。詳細ページのパンくずで一覧に戻る。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="220" y1="116" x2="280" y2="116" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="370" y1="152" x2="370" y2="220" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M460,252 L460,204 Q460,196 468,196 L652,196 Q660,196 660,188 L660,152" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="104" x2="560" y2="104" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="128" x2="460" y2="128" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="382" y="180" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="398" y="191" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ADD</text>

      <rect x="466" y="83" width="92" height="16" rx="2" fill="#f2f8fc"/>
      <text x="512" y="95" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">名前をクリック</text>

      <rect x="484" y="133" width="56" height="16" rx="2" fill="#f2f8fc"/>
      <text x="512" y="145" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">パンくず</text>

      <!-- Welcome page -->
      <rect x="40" y="80" width="180" height="72" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="130" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ようこそページ</text>
      <text x="130" y="130" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">クイックアクションカード</text>

      <!-- Section list (focal) -->
      <rect x="280" y="80" width="180" height="72" rx="6" fill="rgba(0,135,122,0.08)" stroke="#00877a" stroke-width="1"/>
      <text x="370" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">セクションの一覧</text>
      <text x="370" y="130" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">例: Workflows</text>

      <!-- Create form -->
      <rect x="280" y="220" width="180" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="370" y="258" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">新規作成フォーム</text>

      <!-- Detail page -->
      <rect x="560" y="80" width="200" height="72" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="660" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">詳細ページ</text>
      <text x="660" y="130" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">レコード名がタイトル</text>
    </svg>
  </div>
</body>
</html>
