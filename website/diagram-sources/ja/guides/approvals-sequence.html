<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人の承認を依頼する</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f2f8fc; color: #1c1e21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #525860; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #1c1e21; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>人の承認を依頼する</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="approvals-guide-sequence-title approvals-guide-sequence-desc">
      <title id="approvals-guide-sequence-title">人の承認を依頼する</title>
      <desc id="approvals-guide-sequence-desc">承認依頼のシーケンス図。実行エージェントが承認を依頼し、A2Flow が承認者に通知して実行が止まる。承認者が判断すると、A2Flow は対象の各ステップに証明書を渡して実行を再開する。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Lifelines -->
      <line x1="130" y1="136" x2="130" y2="380" stroke="rgba(28,30,33,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="430" y1="136" x2="430" y2="380" stroke="rgba(28,30,33,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="136" x2="700" y2="380" stroke="rgba(28,30,33,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Messages -->
      <line x1="130" y1="176" x2="430" y2="176" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="430" y1="236" x2="700" y2="236" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="296" x2="430" y2="296" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="430" y1="356" x2="130" y2="356" stroke="#00877a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="246" y="155" width="68" height="16" rx="2" fill="#f2f8fc"/>
      <text x="280" y="167" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">承認を依頼</text>

      <rect x="549" y="215" width="32" height="16" rx="2" fill="#f2f8fc"/>
      <text x="565" y="227" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">通知</text>

      <rect x="549" y="275" width="32" height="16" rx="2" fill="#f2f8fc"/>
      <text x="565" y="287" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">判断</text>

      <rect x="246" y="335" width="68" height="16" rx="2" fill="#f2f8fc"/>
      <text x="280" y="347" fill="#00877a" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実行が再開</text>

      <!-- Editorial callouts, kept clear of the lifelines and each other -->
      <path d="M 900 182 Q 852 182 700 228" fill="none" stroke="rgba(28,30,33,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="700" cy="236" r="2" fill="#1c1e21"/>
      <text x="960" y="150" fill="#1c1e21" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">実行全体が</text>
      <text x="960" y="172" fill="#1c1e21" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">止まって待つ</text>

      <path d="M 900 262 Q 852 262 700 288" fill="none" stroke="rgba(28,30,33,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="700" cy="296" r="2" fill="#1c1e21"/>
      <text x="960" y="230" fill="#1c1e21" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">ステップごとに</text>
      <text x="960" y="252" fill="#1c1e21" font-size="16" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="end">証明書が渡される</text>

      <!-- Actor boxes -->
      <rect x="58" y="72" width="144" height="64" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="130" y="100" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実行</text>
      <text x="130" y="120" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">エージェント</text>

      <rect x="358" y="72" width="144" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="430" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">A2Flow</text>

      <rect x="628" y="72" width="144" height="64" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="700" y="110" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">承認者</text>

      <!-- Legend -->
      <line x1="58" y1="400" x2="944" y2="400" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <text x="58" y="416" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">凡例</text>

      <line x1="58" y1="440" x2="86" y2="440" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="94" y="443" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">呼び出し</text>

      <line x1="180" y1="440" x2="208" y2="440" stroke="#00877a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="216" y="443" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">実行の再開</text>
    </svg>
  </div>
</body>
</html>
