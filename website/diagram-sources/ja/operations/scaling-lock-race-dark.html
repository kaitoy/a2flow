<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1 つの会話を動かすのは 1 つだけ</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #030711; color: #e3e3e3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1ab; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #e3e3e3; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>1 つの会話を動かすのは 1 つだけ</h1>

    <svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scaling-lock-race-dark-title scaling-lock-race-dark-desc">
      <title id="scaling-lock-race-dark-title">1 つの会話を動かすのは 1 つだけ</title>
      <desc id="scaling-lock-race-dark-desc">2 つのレプリカが同じセッションを動かそうと競合するシーケンス図。レプリカ 1 が PostgreSQL のアドバイザリロックを取得してクライアント A にストリームを開き、ロックが保持されている間はレプリカ 2 への同じセッションのリクエストが 409 で拒否され、レプリカ 1 のストリームが終わったときにだけロックが解放される。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bf5c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Lifelines -->
      <line x1="110" y1="128" x2="110" y2="600" stroke="rgba(227,227,227,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="330" y1="128" x2="330" y2="600" stroke="rgba(227,227,227,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="550" y1="128" x2="550" y2="600" stroke="rgba(227,227,227,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="770" y1="128" x2="770" y2="600" stroke="rgba(227,227,227,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="990" y1="128" x2="990" y2="600" stroke="rgba(227,227,227,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Messages -->
      <line x1="110" y1="160" x2="330" y2="160" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="330" y1="204" x2="550" y2="204" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="550" y1="248" x2="330" y2="248" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="330" y1="292" x2="110" y2="292" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="990" y1="336" x2="770" y2="336" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="770" y1="380" x2="550" y2="380" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="550" y1="424" x2="770" y2="424" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="770" y1="468" x2="990" y2="468" stroke="#3bf5c4" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <line x1="330" y1="512" x2="110" y2="512" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="330" y1="556" x2="550" y2="556" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="173" y="144" width="94" height="12" rx="2" fill="#030711"/>
      <text x="220" y="153" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">POST /AGENT</text>

      <rect x="406" y="187" width="68" height="14" rx="2" fill="#030711"/>
      <text x="440" y="197" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ロック取得</text>

      <rect x="406" y="231" width="68" height="14" rx="2" fill="#030711"/>
      <text x="440" y="241" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">取得できた</text>

      <rect x="158" y="275" width="124" height="14" rx="2" fill="#030711"/>
      <text x="220" y="285" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">SSE ストリーム開始</text>

      <rect x="833" y="320" width="94" height="12" rx="2" fill="#030711"/>
      <text x="880" y="329" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">POST /AGENT</text>

      <rect x="626" y="363" width="68" height="14" rx="2" fill="#030711"/>
      <text x="660" y="373" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ロック取得</text>

      <rect x="626" y="407" width="68" height="14" rx="2" fill="#030711"/>
      <text x="660" y="417" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">他が保持中</text>

      <rect x="846" y="451" width="68" height="14" rx="2" fill="#030711"/>
      <text x="880" y="461" fill="#3bf5c4" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">409 で拒否</text>

      <rect x="174" y="495" width="92" height="14" rx="2" fill="#030711"/>
      <text x="220" y="505" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ストリーム終了</text>

      <rect x="406" y="539" width="68" height="14" rx="2" fill="#030711"/>
      <text x="440" y="549" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ロック解放</text>

      <!-- Actor boxes -->
      <rect x="38" y="72" width="144" height="56" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="110" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">クライアント A</text>

      <rect x="258" y="72" width="144" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="330" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">レプリカ 1</text>

      <rect x="478" y="72" width="144" height="56" rx="6" fill="rgba(59,245,196,0.10)" stroke="#3bf5c4" stroke-width="1"/>
      <text x="550" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">PostgreSQL</text>

      <rect x="698" y="72" width="144" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="770" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">レプリカ 2</text>

      <rect x="918" y="72" width="144" height="56" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="990" y="104" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">クライアント B</text>

      <!-- Legend -->
      <line x1="38" y1="620" x2="1062" y2="620" stroke="rgba(227,227,227,0.10)" stroke-width="0.8"/>
      <text x="38" y="636" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">凡例</text>

      <line x1="38" y1="660" x2="66" y2="660" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="74" y="663" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">呼び出し</text>

      <line x1="160" y1="660" x2="188" y2="660" stroke="#9aa1ab" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="196" y="663" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">返答</text>

      <line x1="300" y1="660" x2="328" y2="660" stroke="#3bf5c4" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="336" y="663" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">拒否</text>
    </svg>
  </div>
</body>
</html>
