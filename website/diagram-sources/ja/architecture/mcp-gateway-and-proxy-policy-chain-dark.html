<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポリシーチェーン</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #030711; color: #e3e3e3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1ab; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #e3e3e3; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>ポリシーチェーン</h1>

    <svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-gateway-and-proxy-policy-chain-dark-title mcp-gateway-and-proxy-policy-chain-dark-desc">
      <title id="mcp-gateway-and-proxy-policy-chain-dark-title">ポリシーチェーン</title>
      <desc id="mcp-gateway-and-proxy-policy-chain-dark-desc">MCP ゲートウェイがツール呼び出しをどう裁くかを示すフローチャート。ポリシーチェーンが拒否するか許可し、許可された呼び出しはモックが応答するか、資格情報の展開と MCP プロキシを経て本物の MCP サーバーに届く。拒否も本物の呼び出しも監査の記録を残す。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bf5c4"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <line x1="500" y1="88" x2="500" y2="104" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="160" x2="680" y2="160" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="216" x2="500" y2="264" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="608" y1="320" x2="820" y2="320" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="376" x2="500" y2="416" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="464" x2="500" y2="512" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="560" x2="500" y2="608" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,656 L500,704" fill="none" stroke="#3bf5c4" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <path d="M760,188 L760,672 Q760,680 752,680 L568,680 Q560,680 560,688 L560,704" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="624" y="139" width="32" height="14" rx="2" fill="#030711"/>
      <text x="640" y="149" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">拒否</text>

      <rect x="524" y="233" width="32" height="14" rx="2" fill="#030711"/>
      <text x="540" y="243" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">許可</text>

      <rect x="698" y="299" width="32" height="14" rx="2" fill="#030711"/>
      <text x="714" y="309" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">はい</text>

      <rect x="500" y="389" width="44" height="14" rx="2" fill="#030711"/>
      <text x="522" y="399" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">いいえ</text>

      <!-- A: start oval -->
      <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="500" y="60" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実行エージェント</text>
      <text x="500" y="74" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ツールを呼ぶ</text>

      <!-- C: decision diamond -->
      <polygon points="500,104 600,160 500,216 400,160" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="164" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ポリシーチェーン</text>

      <!-- R: refused (end oval) -->
      <rect x="680" y="132" width="160" height="56" rx="28" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="760" y="156" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">拒否</text>
      <text x="760" y="170" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">使えるツールの一覧が返る</text>

      <!-- K: decision diamond -->
      <polygon points="500,264 608,320 500,376 392,320" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="316" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">この実行で</text>
      <text x="500" y="330" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">モックされている?</text>

      <!-- MO: mock response (end oval) -->
      <rect x="820" y="292" width="160" height="56" rx="28" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="900" y="316" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">モックの次の応答</text>
      <text x="900" y="330" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">サーバーには届かない</text>

      <!-- I: credential injection -->
      <rect x="400" y="416" width="200" height="48" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="444" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">資格情報の展開</text>

      <!-- X: MCP proxy -->
      <rect x="420" y="512" width="160" height="48" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="540" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP プロキシ</text>

      <!-- S: MCP server -->
      <rect x="420" y="608" width="160" height="48" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="500" y="636" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP サーバー</text>

      <!-- AU: audit record (focal end oval) -->
      <rect x="410" y="704" width="180" height="56" rx="28" fill="rgba(59,245,196,0.10)" stroke="#3bf5c4" stroke-width="1"/>
      <text x="500" y="738" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">監査の記録</text>
    </svg>
  </div>
</body>
</html>
