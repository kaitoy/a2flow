<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワークフローのステータス遷移</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2f8fc;
      --color-ink:     #1c1e21;
      --color-muted:   #525860;
      --color-accent:  #00877a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>ワークフローのステータス遷移</h1>

    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-design-status-title workflow-design-status-desc">
      <title id="workflow-design-status-title">ワークフローのステータス遷移</title>
      <desc id="workflow-design-status-desc">公開済みのエージェントスキルから generating を経て draft か failed になり、draft から published、modified へ進み、modified から公開で戻る、ワークフローの状態遷移図。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Transitions (drawn first) -->
      <line x1="16" y1="112" x2="40" y2="112" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="200" y1="112" x2="240" y2="112" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="112" x2="440" y2="112" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M320,152 L320,178 Q320,186 328,186 L472,186 Q480,186 480,194 L480,220" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="220" x2="560" y2="152" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="112" x2="640" y2="112" stroke="#00877a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="700" y1="152" x2="700" y2="220" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="220" x2="760" y2="152" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Transition labels -->
      <rect x="204" y="95" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="220" y="105" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">生成</text>

      <rect x="354" y="179" width="80" height="14" rx="2" fill="#f2f8fc"/>
      <text x="394" y="190" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">ステップなし</text>

      <rect x="564" y="179" width="56" height="14" rx="2" fill="#f2f8fc"/>
      <text x="592" y="190" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">書き直し</text>

      <rect x="604" y="95" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="620" y="105" fill="#00877a" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">公開</text>

      <rect x="684" y="179" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="700" y="190" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">編集</text>

      <rect x="744" y="179" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="760" y="190" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">公開</text>

      <!-- Start dot -->
      <circle cx="10" cy="112" r="6" fill="#1c1e21"/>

      <!-- Agent Skill (precondition, dashed) -->
      <rect x="40" y="72" width="160" height="80" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="120" y="108" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">エージェントスキル</text>
      <text x="120" y="124" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">公開済みのリビジョン</text>

      <!-- generating -->
      <rect x="240" y="72" width="160" height="80" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="320" y="108" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">generating</text>
      <text x="320" y="124" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">設計実行が進行中</text>

      <!-- draft -->
      <rect x="440" y="72" width="160" height="80" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="520" y="108" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">draft</text>
      <text x="520" y="124" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">テンプレートと割り当て</text>

      <!-- published (focal) -->
      <rect x="640" y="72" width="160" height="80" rx="8" fill="rgba(0,135,122,0.08)" stroke="#00877a" stroke-width="1"/>
      <text x="720" y="108" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">published</text>
      <text x="720" y="124" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">設計が凍結される</text>

      <!-- failed -->
      <rect x="440" y="220" width="160" height="80" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="520" y="256" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">failed</text>
      <text x="520" y="272" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">理由がレコードに残る</text>

      <!-- modified -->
      <rect x="640" y="220" width="160" height="80" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="720" y="256" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">modified</text>
      <text x="720" y="272" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">実行は公開版を使う</text>

      <!-- Legend -->
      <line x1="40" y1="340" x2="960" y2="340" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <text x="40" y="356" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">凡例</text>

      <rect x="40" y="368" width="24" height="14" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="76" y="379" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">前提条件</text>

      <rect x="220" y="368" width="24" height="14" rx="8" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="256" y="379" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">ステータス</text>

      <rect x="360" y="368" width="24" height="14" rx="8" fill="rgba(0,135,122,0.08)" stroke="#00877a" stroke-width="1"/>
      <text x="396" y="379" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">実行に使われる版</text>
    </svg>
  </div>
</body>
</html>
