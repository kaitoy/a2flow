<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信頼境界を越える</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #030711; color: #e3e3e3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1ab; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #e3e3e3; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>信頼境界を越える</h1>

    <svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-gateway-and-proxy-trust-boundary-dark-title mcp-gateway-and-proxy-trust-boundary-dark-desc">
      <title id="mcp-gateway-and-proxy-trust-boundary-dark-title">信頼境界を越える</title>
      <desc id="mcp-gateway-and-proxy-trust-boundary-dark-desc">呼び出しを許可するか、モックするか、どの資格情報が要るかを決める MCP ゲートウェイが、認可済みの呼び出しをちょうど 1 件だけ信頼境界を越えて MCP プロキシに渡し、MCP プロキシが本物の MCP サーバーを起動または接続することを示すアーキテクチャ図。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="40" y="60" width="300" height="120" rx="8" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="52" y="63" width="128" height="14" rx="2" fill="#030711"/>
      <text x="116" y="73" fill="rgba(227,227,227,0.40)" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">エージェントが動く側</text>

      <rect x="400" y="60" width="240" height="120" rx="8" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="412" y="63" width="92" height="14" rx="2" fill="#030711"/>
      <text x="458" y="73" fill="rgba(227,227,227,0.40)" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">サンドボックス</text>

      <!-- Arrows -->
      <line x1="300" y1="124" x2="440" y2="124" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="124" x2="700" y2="124" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow label -->
      <rect x="342" y="103" width="56" height="14" rx="2" fill="#030711"/>
      <text x="370" y="113" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">認可済み</text>

      <!-- MCP gateway -->
      <rect x="80" y="92" width="220" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="190" y="118" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP ゲートウェイ</text>
      <text x="190" y="134" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">許可・モック・資格情報を決める</text>

      <!-- MCP proxy (inside sandbox zone) -->
      <rect x="440" y="92" width="160" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="520" y="118" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP プロキシ</text>
      <text x="520" y="134" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">起動または接続</text>

      <!-- MCP server (outside both zones) -->
      <rect x="700" y="92" width="160" height="64" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="780" y="118" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">MCP サーバー</text>
      <text x="780" y="134" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" text-anchor="middle">管理の外にある</text>

      <!-- Legend -->
      <line x1="40" y1="204" x2="860" y2="204" stroke="rgba(227,227,227,0.10)" stroke-width="0.8"/>
      <text x="40" y="220" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">凡例</text>

      <rect x="40" y="232" width="24" height="14" rx="4" fill="rgba(227,227,227,0.02)" stroke="rgba(227,227,227,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="72" y="243" fill="#9aa1ab" font-size="12" font-family="'Inter', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif">信頼境界</text>
    </svg>
  </div>
</body>
</html>
