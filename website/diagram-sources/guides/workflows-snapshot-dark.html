<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Running a workflow makes a snapshot</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #030711; color: #e3e3e3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1ab; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #e3e3e3; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Running a workflow makes a snapshot</h1>

    <svg viewBox="0 0 540 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflows-snapshot-dark-title workflows-snapshot-dark-desc">
      <title id="workflows-snapshot-dark-title">Running a workflow makes a snapshot</title>
      <desc id="workflows-snapshot-dark-desc">Flowchart showing the published Workflow and its chosen tool mocks copied by value onto a new Workflow execution snapshot, which opens a Workflow session.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <path d="M160,108 L160,140 Q160,148 168,148 L240,148 Q248,148 248,156 L248,160" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M400,108 L400,140 Q400,148 392,148 L320,148 Q312,148 312,156 L312,160" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="228" x2="280" y2="280" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="174" y="126" width="32" height="14" rx="2" fill="#030711"/>
      <text x="190" y="137" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">RUN</text>

      <rect x="328" y="126" width="68" height="14" rx="2" fill="#030711"/>
      <text x="362" y="137" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">COPIED</text>

      <!-- Workflow -->
      <rect x="60" y="40" width="200" height="68" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="160" y="67" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Workflow</text>
      <text x="160" y="86" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">published version</text>

      <!-- Chosen tool mocks -->
      <rect x="300" y="40" width="200" height="68" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="400" y="82" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Chosen tool mocks</text>

      <!-- Workflow execution (focal) -->
      <rect x="180" y="160" width="200" height="68" rx="6" fill="rgba(59,245,196,0.10)" stroke="#3bf5c4" stroke-width="1"/>
      <text x="280" y="187" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Workflow execution</text>
      <text x="280" y="206" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">the snapshot</text>

      <!-- Workflow session -->
      <rect x="180" y="280" width="200" height="56" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="280" y="314" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Workflow session</text>
    </svg>
  </div>
</body>
</html>
