<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where a tool mock intercepts</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f2f8fc; color: #1c1e21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #525860; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #1c1e21; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Where a tool mock intercepts</h1>

    <svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tool-mocks-decision-title tool-mocks-decision-desc">
      <title id="tool-mocks-decision-title">Where a tool mock intercepts</title>
      <desc id="tool-mocks-decision-desc">Flowchart showing the agent calling a tool, checking whether it is mocked for this run, and either reaching the real MCP server or receiving the mock's next response with no server contacted.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="360" y1="84" x2="360" y2="112" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="450" y1="168" x2="520" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="224" x2="360" y2="268" stroke="#00877a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Labels -->
      <rect x="468" y="148" width="28" height="14" rx="2" fill="#f2f8fc"/>
      <text x="482" y="159" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="376" y="236" width="32" height="14" rx="2" fill="#f2f8fc"/>
      <text x="392" y="247" fill="#00877a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <!-- The agent -->
      <rect x="260" y="20" width="200" height="64" rx="28" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="360" y="50" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">The agent</text>
      <text x="360" y="70" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">calls a tool</text>

      <!-- Decision -->
      <polygon points="360,112 450,168 360,224 270,168" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="360" y="164" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Mocked for</text>
      <text x="360" y="178" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">this run?</text>

      <!-- MCP server -->
      <rect x="520" y="136" width="200" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="620" y="166" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MCP server</text>
      <text x="620" y="186" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">real side effect</text>

      <!-- Mock's next response (focal) -->
      <rect x="260" y="268" width="200" height="72" rx="28" fill="rgba(0,135,122,0.08)" stroke="#00877a" stroke-width="1"/>
      <text x="360" y="298" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Mock's next response</text>
      <text x="360" y="318" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">no server contacted</text>

      <!-- Legend -->
      <line x1="40" y1="356" x2="720" y2="356" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <text x="40" y="372" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="384" width="24" height="12" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="72" y="394" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Start / end</text>

      <polygon points="212,390 224,384 236,390 224,396" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="248" y="394" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Decision</text>
    </svg>
  </div>
</body>
</html>
