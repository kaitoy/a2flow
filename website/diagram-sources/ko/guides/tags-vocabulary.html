<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하나의 어휘, 7개 레지스트리</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2f8fc;
      --color-ink:     #1c1e21;
      --color-muted:   #525860;
      --color-accent:  #00877a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>하나의 어휘, 7개 레지스트리</h1>

    <svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tags-vocabulary-title tags-vocabulary-desc">
      <title id="tags-vocabulary-title">하나의 어휘, 7개 레지스트리</title>
      <desc id="tags-vocabulary-desc">테넌트마다 하나인 공유 태그 어휘가 태그를 붙일 수 있는 7개 레지스트리(시크릿, MCP 서버, 에이전트 스킬, 지식 베이스, 워크플로, 도구 모의, 사용자 그룹)에 적용되는 것을 보여 주는 순서도.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows: hub -> 7 registries; the left ones bend lower the further in they leave the hub, the right ones mirror it, so none cross -->
      <path d="M380,132 L380,136 Q380,144 372,144 L82,144 Q74,144 74,152 L74,240" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420,132 L420,152 Q420,160 412,160 L224,160 Q216,160 216,168 L216,240" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M460,132 L460,168 Q460,176 452,176 L366,176 Q358,176 358,184 L358,240" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,132 L500,240" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M540,132 L540,168 Q540,176 548,176 L634,176 Q642,176 642,184 L642,240" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M580,132 L580,152 Q580,160 588,160 L776,160 Q784,160 784,168 L784,240" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M620,132 L620,136 Q620,144 628,144 L918,144 Q926,144 926,152 L926,240" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Hub (focal) -->
      <rect x="360" y="60" width="280" height="72" rx="6" fill="rgba(0,135,122,0.08)" stroke="#00877a" stroke-width="1"/>
      <text x="500" y="90" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">태그 어휘</text>
      <text x="500" y="110" fill="#525860" font-size="12" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">테넌트마다 하나</text>

      <!-- Seven registries -->
      <rect x="12" y="240" width="124" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="74" y="272" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">시크릿</text>

      <rect x="154" y="240" width="124" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="216" y="272" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">MCP 서버</text>

      <rect x="296" y="240" width="124" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="358" y="272" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">에이전트 스킬</text>

      <rect x="438" y="240" width="124" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="272" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">지식 베이스</text>

      <rect x="580" y="240" width="124" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="642" y="272" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">워크플로</text>

      <rect x="722" y="240" width="124" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="784" y="272" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">도구 모의</text>

      <rect x="864" y="240" width="124" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="926" y="272" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">사용자 그룹</text>
    </svg>
  </div>
</body>
</html>
