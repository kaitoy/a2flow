<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Où une entrée de secret est utilisée</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #030711; color: #e3e3e3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1ab; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #e3e3e3; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Où une entrée de secret est utilisée</h1>

    <svg viewBox="0 0 780 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secrets-usage-dark-title secrets-usage-dark-desc">
      <title id="secrets-usage-dark-title">Où une entrée de secret est utilisée</title>
      <desc id="secrets-usage-dark-desc">Organigramme montrant l'entrée d'un secret référencée soit dans les en-têtes et variables d'environnement d'un serveur MCP, soit comme mot de passe d'authentification du dépôt d'une compétence d'agent.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <line x1="200" y1="116" x2="260" y2="116" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420,104 L448,104 Q456,104 456,96 L456,64 Q456,56 464,56 L480,56" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M420,128 L448,128 Q456,128 456,136 L456,188 Q456,196 464,196 L480,196" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="423" y="56" width="54" height="14" rx="2" fill="#030711"/>
      <text x="450" y="67" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">EN-TÊTES</text>

      <rect x="368" y="164" width="108" height="14" rx="2" fill="#030711"/>
      <text x="422" y="175" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AUTHENTIFICATION</text>

      <!-- Secret -->
      <rect x="40" y="80" width="160" height="72" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="120" y="110" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Secret</text>
      <text x="120" y="130" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">name</text>

      <!-- Entry (focal) -->
      <rect x="260" y="80" width="160" height="72" rx="6" fill="rgba(59,245,196,0.10)" stroke="#3bf5c4" stroke-width="1"/>
      <text x="340" y="110" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Entrée</text>
      <text x="340" y="130" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">key</text>

      <!-- MCP server headers/env -->
      <rect x="480" y="20" width="260" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="610" y="50" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Serveur MCP</text>
      <text x="610" y="70" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">en-têtes + variables d'environnement</text>

      <!-- Agent Skill auth -->
      <rect x="480" y="160" width="260" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="610" y="190" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Compétence d'agent</text>
      <text x="610" y="210" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">mot de passe d'authentification du dépôt</text>
    </svg>
  </div>
</body>
</html>
