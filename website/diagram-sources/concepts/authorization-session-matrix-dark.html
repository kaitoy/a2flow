<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who can reach which session</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #030711; color: #e3e3e3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1ab; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #e3e3e3; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Access matrix · Diagram Design</p>
    <h1>Who can reach which session</h1>

    <svg viewBox="0 0 1248 296" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="authorization-session-matrix-dark-title authorization-session-matrix-dark-desc">
      <title id="authorization-session-matrix-dark-title">Who can reach which session</title>
      <desc id="authorization-session-matrix-dark-desc">Access matrix showing that Developers, the workflow's creator, and Super Admin reach a Design session, while the run's initiator, its designated approvers, and Super Admin reach a Workflow session, with Admin holding read-only access to the Workflow session.</desc>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Header row -->
      <rect x="12" y="72" width="208" height="56" rx="6" fill="#242526" stroke="rgba(227,227,227,0.12)" stroke-width="0.8"/>
      <text x="116" y="98" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Session</text>
      <text x="116" y="116" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">vs. actor</text>

      <rect x="232" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="306" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Developer</text>
      <text x="306" y="112" fill="rgba(227,227,227,0.85)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">any in tenant</text>

      <rect x="396" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="470" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Creator</text>
      <text x="470" y="112" fill="rgba(227,227,227,0.85)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">workflow's createdBy</text>

      <rect x="560" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="634" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Initiator</text>
      <text x="634" y="112" fill="rgba(227,227,227,0.85)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">started the run</text>

      <rect x="724" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="798" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Approver</text>
      <text x="798" y="112" fill="rgba(227,227,227,0.85)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">designated for it</text>

      <rect x="888" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="962" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Admin</text>
      <text x="962" y="112" fill="rgba(227,227,227,0.85)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tenant admin</text>

      <rect x="1052" y="72" width="148" height="56" rx="6" fill="#242526"/>
      <text x="1126" y="94" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Super Admin</text>
      <text x="1126" y="112" fill="rgba(227,227,227,0.85)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unrestricted</text>

      <!-- Row 0: Design session -->
      <rect x="12" y="144" width="208" height="40" rx="4" fill="#242526" stroke="rgba(227,227,227,0.12)" stroke-width="0.8"/>
      <text x="24" y="168" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif">Design session</text>

      <rect x="232" y="144" width="148" height="40" rx="4" fill="rgba(227,227,227,0.08)" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="306" y="168" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Yes</text>

      <rect x="396" y="144" width="148" height="40" rx="4" fill="rgba(227,227,227,0.08)" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="470" y="168" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Yes</text>

      <rect x="560" y="144" width="148" height="40" rx="4" fill="#030711" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="634" y="168" fill="#7e8794" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">No access</text>

      <rect x="724" y="144" width="148" height="40" rx="4" fill="#030711" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="798" y="168" fill="#7e8794" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">No access</text>

      <rect x="888" y="144" width="148" height="40" rx="4" fill="#030711" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="962" y="168" fill="#7e8794" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">No access</text>

      <rect x="1052" y="144" width="148" height="40" rx="4" fill="rgba(227,227,227,0.08)" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="1126" y="168" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Yes</text>

      <!-- Row 1: Workflow session -->
      <rect x="12" y="188" width="208" height="40" rx="4" fill="#242526" stroke="rgba(227,227,227,0.12)" stroke-width="0.8"/>
      <text x="24" y="212" fill="#e3e3e3" font-size="13" font-weight="600" font-family="'Inter', sans-serif">Workflow session</text>

      <rect x="232" y="188" width="148" height="40" rx="4" fill="#030711" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="306" y="212" fill="#7e8794" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">No access</text>

      <rect x="396" y="188" width="148" height="40" rx="4" fill="#030711" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="470" y="212" fill="#7e8794" font-size="12" font-family="'Inter', sans-serif" text-anchor="middle">No access</text>

      <rect x="560" y="188" width="148" height="40" rx="4" fill="rgba(227,227,227,0.08)" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="634" y="212" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Yes</text>

      <rect x="724" y="188" width="148" height="40" rx="4" fill="rgba(227,227,227,0.08)" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="798" y="212" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Yes</text>

      <rect x="888" y="188" width="148" height="40" rx="4" fill="rgba(59,245,196,0.10)" stroke="#3bf5c4" stroke-width="1.4"/>
      <text x="962" y="204" fill="#3bf5c4" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Read only</text>
      <text x="962" y="218" fill="rgba(59,245,196,0.85)" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the one asymmetry</text>

      <rect x="1052" y="188" width="148" height="40" rx="4" fill="rgba(227,227,227,0.08)" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="1126" y="212" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Yes</text>

      <!-- Legend -->
      <line x1="12" y1="248" x2="1200" y2="248" stroke="rgba(227,227,227,0.10)" stroke-width="0.8"/>
      <text x="12" y="269" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="260" width="18" height="15" rx="2" fill="rgba(227,227,227,0.08)" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="146" y="272" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">Full access</text>

      <rect x="260" y="260" width="18" height="15" rx="2" fill="rgba(59,245,196,0.10)" stroke="#3bf5c4" stroke-width="1"/>
      <text x="286" y="272" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">Read only</text>

      <rect x="400" y="260" width="18" height="15" rx="2" fill="#030711" stroke="rgba(227,227,227,0.12)" stroke-width="0.6"/>
      <text x="426" y="272" fill="#9aa1ab" font-size="9.5" font-family="'Inter', sans-serif">No access</text>
    </svg>
  </div>
</body>
</html>
