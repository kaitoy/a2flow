<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegación de la interfaz de administración</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #030711; color: #e3e3e3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1ab; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #e3e3e3; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Navegación de la interfaz de administración</h1>

    <svg viewBox="0 0 800 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="admin-ui-navigation-dark-title admin-ui-navigation-dark-desc">
      <title id="admin-ui-navigation-dark-title">Navegación de la interfaz de administración</title>
      <desc id="admin-ui-navigation-dark-desc">Diagrama de flujo del modelo de navegación de la interfaz de administración: la página de bienvenida lleva a la lista de una sección, desde la que se abre un formulario de creación o, al hacer clic en un nombre, una página de detalle; la ruta de navegación de la página de detalle devuelve a la lista.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <line x1="220" y1="116" x2="280" y2="116" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="370" y1="152" x2="370" y2="220" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M460,252 L460,204 Q460,196 468,196 L672,196 Q680,196 680,188 L680,152" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="460" y1="104" x2="590" y2="104" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="590" y1="128" x2="460" y2="128" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="375" y="179" width="46" height="16" rx="2" fill="#030711"/>
      <text x="398" y="191" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">AÑADIR</text>

      <rect x="502" y="84" width="46" height="14" rx="2" fill="#030711"/>
      <text x="525" y="95" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NOMBRE</text>

      <rect x="471" y="134" width="108" height="14" rx="2" fill="#030711"/>
      <text x="525" y="145" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">RUTA DE NAVEGACIÓN</text>

      <!-- Welcome page -->
      <rect x="40" y="80" width="180" height="72" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="130" y="110" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Página de bienvenida</text>
      <text x="130" y="130" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">tarjetas de acción rápida</text>

      <!-- Section list (focal) -->
      <rect x="280" y="80" width="180" height="72" rx="6" fill="rgba(59,245,196,0.10)" stroke="#3bf5c4" stroke-width="1"/>
      <text x="370" y="110" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Lista de la sección</text>
      <text x="370" y="130" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">p. ej., Flujos de trabajo</text>

      <!-- Create form -->
      <rect x="280" y="220" width="180" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="370" y="258" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Formulario de creación</text>

      <!-- Detail page -->
      <rect x="590" y="80" width="180" height="72" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="680" y="110" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Página de detalle</text>
      <text x="680" y="130" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">con el nombre como título</text>
    </svg>
  </div>
</body>
</html>
