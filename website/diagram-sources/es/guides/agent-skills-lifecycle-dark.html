<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ciclo de vida de una skill de agente</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #030711; color: #e3e3e3; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #9aa1ab; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #e3e3e3; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>Ciclo de vida de una skill de agente</h1>

    <svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-skills-lifecycle-dark-title agent-skills-lifecycle-dark-desc">
      <title id="agent-skills-lifecycle-dark-title">Ciclo de vida de una skill de agente</title>
      <desc id="agent-skills-lifecycle-dark-desc">Diagrama de estados que muestra cómo una skill de agente se registra, se clona en segundo plano, pasa a estar lista o fallida, se actualiza para reintentarlo desde cualquiera de los dos estados y, una vez lista, genera un nuevo flujo de trabajo.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa1ab"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#030711"/>

      <!-- Arrows -->
      <line x1="200" y1="108" x2="240" y2="108" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="108" x2="440" y2="108" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="144" x2="300" y2="220" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="220" x2="360" y2="144" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M520,72 L520,48 Q520,40 512,40 L328,40 Q320,40 320,48 L320,72" fill="none" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="144" x2="520" y2="220" stroke="#9aa1ab" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="366" y="175" width="68" height="16" rx="2" fill="#030711"/>
      <text x="400" y="187" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ACTUALIZAR</text>

      <rect x="385" y="17" width="70" height="16" rx="2" fill="#030711"/>
      <text x="420" y="29" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">ACTUALIZAR</text>

      <rect x="534" y="176" width="64" height="14" rx="2" fill="#030711"/>
      <text x="566" y="187" fill="#9aa1ab" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">GENERAR</text>

      <!-- Register -->
      <rect x="40" y="72" width="160" height="72" rx="24" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="120" y="102" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Registrar</text>
      <text x="120" y="122" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">responde de inmediato</text>

      <!-- Cloning -->
      <rect x="240" y="72" width="160" height="72" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="320" y="102" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Clonando</text>
      <text x="320" y="122" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">en segundo plano</text>

      <!-- ready (focal) -->
      <rect x="440" y="72" width="160" height="72" rx="8" fill="rgba(59,245,196,0.10)" stroke="#3bf5c4" stroke-width="1"/>
      <text x="520" y="102" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">listo</text>
      <text x="520" y="122" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">revisión publicada</text>

      <!-- failed -->
      <rect x="240" y="220" width="160" height="72" rx="8" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
      <text x="320" y="250" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">fallido</text>
      <text x="320" y="270" fill="#9aa1ab" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">motivo registrado</text>

      <!-- New workflow -->
      <rect x="430" y="220" width="180" height="56" rx="24" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
      <text x="520" y="253" fill="#e3e3e3" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Nuevo flujo de trabajo</text>
    </svg>
  </div>
</body>
</html>
