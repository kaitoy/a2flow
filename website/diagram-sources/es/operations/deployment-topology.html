<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topología de despliegue</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f2f8fc; color: #1c1e21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #525860; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #1c1e21; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Topología de despliegue</h1>

    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-topology-title deployment-topology-desc">
      <title id="deployment-topology-title">Topología de despliegue</title>
      <desc id="deployment-topology-desc">Diagrama de arquitectura que muestra el navegador llegando a un proxy inverso que dirige las solicitudes de API (/api/*) directamente a la API del backend y las solicitudes de páginas al frontend, y a la API del backend, que también ejecuta el worker de correo, accediendo al estado duradero (base de datos, almacén de skills, clave secreta), a los servicios externos (proveedor de LLM, servidores MCP) y a un relé SMTP.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="40" y="480" width="360" height="120" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <rect x="52" y="484" width="112" height="12" rx="2" fill="#f2f8fc"/>
      <text x="108" y="493" fill="rgba(28,30,33,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ESTADO DURADERO</text>

      <rect x="440" y="480" width="280" height="120" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <rect x="452" y="484" width="128" height="12" rx="2" fill="#f2f8fc"/>
      <text x="516" y="493" fill="rgba(28,30,33,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SERVICIOS EXTERNOS</text>

      <!-- Arrows -->
      <line x1="500" y1="96" x2="500" y2="136" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="192" x2="500" y2="336" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M620,164 L812,164 Q820,164 820,172 L820,232" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M440,408 L440,436 Q440,444 432,444 L228,444 Q220,444 220,452 L220,480" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M500,408 L500,436 Q500,444 508,444 L572,444 Q580,444 580,452 L580,480" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M560,408 L560,420 Q560,428 568,428 L852,428 Q860,428 860,436 L860,512" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Label -->
      <rect x="474" y="108" width="52" height="12" rx="2" fill="#f2f8fc"/>
      <text x="500" y="117" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">HTTPS</text>
      <rect x="470" y="258" width="60" height="12" rx="2" fill="#f2f8fc"/>
      <text x="500" y="267" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">/api/*</text>
      <rect x="690" y="158" width="52" height="12" rx="2" fill="#f2f8fc"/>
      <text x="716" y="167" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">páginas</text>

      <!-- Browser (external) -->
      <rect x="380" y="40" width="240" height="56" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="500" y="74" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Navegador</text>

      <!-- Reverse proxy -->
      <rect x="380" y="136" width="240" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="160" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Proxy inverso</text>
      <text x="500" y="176" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">balanceador de carga</text>

      <!-- Frontend -->
      <rect x="700" y="232" width="240" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="820" y="260" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Frontend</text>
      <text x="820" y="276" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">interfaz de chat</text>

      <!-- Backend API (focal — folds in the email worker) -->
      <rect x="380" y="336" width="240" height="72" rx="6" fill="rgba(0,135,122,0.08)" stroke="#00877a" stroke-width="1"/>
      <text x="500" y="366" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">API del backend</text>
      <text x="500" y="382" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">uvicorn + worker de correo</text>

      <!-- Durable state: Database, Skill store, Secret key -->
      <rect x="60" y="512" width="100" height="72" rx="6" fill="rgba(28,30,33,0.05)" stroke="#525860" stroke-width="1"/>
      <text x="110" y="542" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Base de datos</text>
      <text x="110" y="558" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">registros</text>

      <rect x="170" y="512" width="100" height="72" rx="6" fill="rgba(28,30,33,0.05)" stroke="#525860" stroke-width="1"/>
      <text x="220" y="531" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Almacén</text><text x="220" y="546" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">de skills</text>
      <text x="220" y="558" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repos clonados</text>

      <rect x="280" y="512" width="100" height="72" rx="6" fill="rgba(28,30,33,0.05)" stroke="#525860" stroke-width="1"/>
      <text x="330" y="542" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Clave secreta</text>
      <text x="330" y="558" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cifra</text>

      <!-- External services: LLM provider, MCP servers -->
      <rect x="460" y="512" width="110" height="72" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="515" y="545" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Proveedor</text><text x="515" y="561" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">de LLM</text>

      <rect x="590" y="512" width="110" height="72" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="645" y="545" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Servidores</text><text x="645" y="561" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MCP</text>

      <!-- SMTP relay (external) -->
      <rect x="780" y="512" width="160" height="72" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="860" y="552" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Relé SMTP</text>

      <!-- Legend -->
      <line x1="40" y1="632" x2="960" y2="632" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <text x="40" y="648" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="40" y="660" width="24" height="14" rx="4" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="72" y="671" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Componente de A2Flow</text>

      <rect x="220" y="660" width="24" height="14" rx="4" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="252" y="671" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Sistema externo</text>

      <rect x="400" y="660" width="24" height="14" rx="4" fill="rgba(28,30,33,0.05)" stroke="#525860" stroke-width="1"/>
      <text x="432" y="671" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Almacén de datos</text>
    </svg>
  </div>
</body>
</html>
