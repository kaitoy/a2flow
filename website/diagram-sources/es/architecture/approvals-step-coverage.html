<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qué cubre una aprobación</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f2f8fc; color: #1c1e21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #525860; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #1c1e21; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Qué cubre una aprobación</h1>

    <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="approvals-step-coverage-title approvals-step-coverage-desc">
      <title id="approvals-step-coverage-title">Qué cubre una aprobación</title>
      <desc id="approvals-step-coverage-desc">Diagrama de flujo de una cadena de cinco pasos en la que la aprobación A cubre los tres primeros pasos y la aprobación B toma el relevo a partir del cuarto, lo que muestra que una aprobación cubre el paso que nombra y todo lo que sigue hasta la próxima aprobación.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="120" y1="88" x2="120" y2="140" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="200" y1="168" x2="220" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="168" x2="400" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="560" y1="168" x2="580" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="660" y1="88" x2="660" y2="140" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="168" x2="760" y2="168" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Gates -->
      <rect x="40" y="40" width="160" height="48" rx="24" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="120" y="60" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Aprobación A</text>
      <text x="120" y="76" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">barrera</text>

      <rect x="580" y="40" width="160" height="48" rx="24" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="660" y="60" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Aprobación B</text>
      <text x="660" y="76" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">barrera</text>

      <!-- Steps -->
      <rect x="40" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="120" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Pedir el visto bueno</text>

      <rect x="220" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="300" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Lanzar la instancia</text>

      <rect x="400" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="480" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Etiquetar la instancia</text>

      <rect x="580" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="660" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Volver a preguntar</text>

      <rect x="760" y="140" width="160" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="840" y="172" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Eliminar la instantánea</text>

      <!-- Coverage brackets -->
      <path d="M40,208 L40,214 L560,214 L560,208" fill="none" stroke="#00877a" stroke-width="1.2"/>
      <text x="300" y="230" fill="#00877a" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CUBRE LA APROBACIÓN A</text>

      <path d="M580,208 L580,214 L920,214 L920,208" fill="none" stroke="#00877a" stroke-width="1.2"/>
      <text x="750" y="230" fill="#00877a" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CUBRE LA APROBACIÓN B</text>

      <!-- Legend -->
      <line x1="40" y1="256" x2="960" y2="256" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <text x="40" y="272" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="40" y="284" width="24" height="14" rx="7" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="76" y="295" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Barrera de aprobación</text>
    </svg>
  </div>
</body>
</html>
