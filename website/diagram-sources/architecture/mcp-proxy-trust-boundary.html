<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossing the trust boundary</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f2f8fc; color: #1c1e21; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #525860; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: #1c1e21; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Crossing the trust boundary</h1>

    <svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-proxy-trust-boundary-title mcp-proxy-trust-boundary-desc">
      <title id="mcp-proxy-trust-boundary-title">Crossing the trust boundary</title>
      <desc id="mcp-proxy-trust-boundary-desc">Architecture diagram showing the execution agent, which decides whether a call is allowed, mocked, and which credentials it needs, handing exactly one authorized call across a trust boundary into the sandbox, which starts or connects to the real MCP server.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Zones (bg -> zones -> arrows -> nodes) -->
      <rect x="40" y="60" width="300" height="120" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="52" y="64" width="112" height="12" rx="2" fill="#f2f8fc"/>
      <text x="108" y="73" fill="rgba(28,30,33,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RUNS THE AGENT</text>

      <rect x="400" y="60" width="240" height="120" rx="8" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="412" y="64" width="64" height="12" rx="2" fill="#f2f8fc"/>
      <text x="444" y="73" fill="rgba(28,30,33,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SANDBOX</text>

      <!-- Arrows -->
      <line x1="300" y1="124" x2="440" y2="124" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="124" x2="700" y2="124" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow label -->
      <rect x="328" y="104" width="84" height="12" rx="2" fill="#f2f8fc"/>
      <text x="370" y="113" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUTHORIZED</text>

      <!-- Execution agent -->
      <rect x="80" y="92" width="220" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="190" y="118" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Execution agent</text>
      <text x="190" y="134" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">allowed, mocked, credentials</text>

      <!-- Runner (inside sandbox zone) -->
      <rect x="440" y="92" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="520" y="118" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Runner</text>
      <text x="520" y="134" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">starts or connects</text>

      <!-- MCP server (outside both zones) -->
      <rect x="700" y="92" width="160" height="64" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="780" y="118" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MCP server</text>
      <text x="780" y="134" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">outside our control</text>

      <!-- Legend -->
      <line x1="40" y1="204" x2="860" y2="204" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <text x="40" y="220" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="232" width="24" height="14" rx="4" fill="rgba(28,30,33,0.02)" stroke="rgba(28,30,33,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="72" y="243" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Trust boundary</text>
    </svg>
  </div>
</body>
</html>
