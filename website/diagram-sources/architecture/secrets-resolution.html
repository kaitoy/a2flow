<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret reference resolution</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2f8fc;
      --color-ink:     #1c1e21;
      --color-muted:   #525860;
      --color-accent:  #00877a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>How a secret reference resolves</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secrets-resolution-title secrets-resolution-desc">
      <title id="secrets-resolution-title">Secret reference resolution</title>
      <desc id="secrets-resolution-desc">Flowchart showing a name/key secret reference branching by storage type: local secrets are decrypted from the stored value, Vault secrets are read live, and both feed an MCP server connection or a skill repository clone.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows (behind nodes) -->
      <line x1="500" y1="88" x2="500" y2="128" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M400,180 L258,180 Q250,180 250,188 L250,272" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M600,180 L742,180 Q750,180 750,188 L750,272" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M250,328 L250,352 Q250,360 258,360 L448,360 Q456,360 456,368 L456,392" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M750,328 L750,352 Q750,360 742,360 L552,360 Q544,360 544,368 L544,392" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Branch labels -->
      <rect x="305" y="160" width="48" height="12" rx="2" fill="#f2f8fc"/>
      <text x="329" y="169" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">LOCAL</text>

      <rect x="647" y="160" width="48" height="12" rx="2" fill="#f2f8fc"/>
      <text x="671" y="169" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.1em">VAULT</text>

      <!-- R: reference (start oval) -->
      <rect x="400" y="40" width="200" height="48" rx="24" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="500" y="64" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">A reference</text>
      <text x="500" y="78" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">name/key</text>

      <!-- V: decision diamond -->
      <polygon points="500,132 600,180 500,228 400,180" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="184" fill="#1c1e21" font-size="13" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Which type?</text>

      <!-- L: local -->
      <rect x="160" y="272" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="250" y="298" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Decrypt the</text>
      <text x="250" y="314" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">stored value</text>

      <!-- H: vault -->
      <rect x="660" y="272" width="180" height="56" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="750" y="298" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Read it live</text>
      <text x="750" y="314" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">from Vault</text>

      <!-- U: consumer (end oval) -->
      <rect x="368" y="392" width="264" height="56" rx="28" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="500" y="416" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MCP server connection</text>
      <text x="500" y="432" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">or a skill repository clone</text>
    </svg>
  </div>
</body>
</html>
