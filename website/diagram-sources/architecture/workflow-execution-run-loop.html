<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the run advances</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f2f8fc;
      --color-ink:     #1c1e21;
      --color-muted:   #525860;
      --color-accent:  #00877a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>How the run advances</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-execution-run-loop-title workflow-execution-run-loop-desc">
      <title id="workflow-execution-run-loop-title">How the run advances</title>
      <desc id="workflow-execution-run-loop-desc">Flowchart showing the task-advancement loop: list tasks, pick one whose dependencies have completed, mark it in progress, do the work, mark it ended, and repeat until every task has ended and the run settles.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#525860"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00877a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f2f8fc"/>

      <!-- Arrows -->
      <line x1="500" y1="88" x2="500" y2="112" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="208" x2="500" y2="256" stroke="#00877a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="500" y1="304" x2="500" y2="344" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="392" x2="500" y2="432" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="160" x2="720" y2="160" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M400,464 L168,464 Q160,464 160,456 L160,72 Q160,64 168,64 L400,64" fill="none" stroke="#525860" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="484" y="222" width="32" height="12" rx="2" fill="#f2f8fc"/>
      <text x="500" y="231" fill="#00877a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="644" y="154" width="24" height="12" rx="2" fill="#f2f8fc"/>
      <text x="656" y="163" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <!-- List the run's tasks -->
      <rect x="400" y="40" width="200" height="48" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="68" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">List the run's tasks</text>

      <!-- Decision diamond -->
      <polygon points="500,112 600,160 500,208 400,160" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="156" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">A pending task whose</text>
      <text x="500" y="170" fill="#1c1e21" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">deps have completed?</text>

      <!-- Mark it in_progress -->
      <rect x="400" y="256" width="200" height="48" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="284" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Mark it in_progress</text>

      <!-- Do the work -->
      <rect x="400" y="344" width="200" height="48" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="368" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Do the work</text>
      <text x="500" y="384" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">tools, approvals, conversation</text>

      <!-- Mark it ended -->
      <rect x="400" y="432" width="200" height="64" rx="6" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="500" y="460" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Mark it completed,</text>
      <text x="500" y="476" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">failed, or skipped</text>

      <!-- Run settles (end oval) -->
      <rect x="720" y="136" width="200" height="48" rx="24" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="820" y="160" fill="#1c1e21" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Run settles</text>
      <text x="820" y="174" fill="#525860" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">every task has ended</text>

      <!-- Legend -->
      <line x1="40" y1="530" x2="960" y2="530" stroke="rgba(28,30,33,0.10)" stroke-width="0.8"/>
      <text x="40" y="546" fill="#525860" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="562" width="24" height="12" rx="2" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="72" y="572" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Step (rectangle)</text>

      <polygon points="252,568 264,562 276,568 264,574" fill="#ffffff" stroke="#1c1e21" stroke-width="1"/>
      <text x="288" y="572" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Decision (diamond)</text>

      <rect x="440" y="562" width="24" height="12" rx="6" fill="rgba(28,30,33,0.03)" stroke="rgba(28,30,33,0.30)" stroke-width="1"/>
      <text x="472" y="572" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Loop exit (oval)</text>

      <line x1="616" y1="568" x2="644" y2="568" stroke="#00877a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="652" y="572" fill="#525860" font-size="9.5" font-family="'Inter', sans-serif">Continues the loop</text>
    </svg>
  </div>
</body>
</html>
