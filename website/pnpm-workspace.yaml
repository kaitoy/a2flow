# @swc/core unpacks its platform binary in a postinstall script; @docusaurus/faster
# needs it. core-js's postinstall only prints a funding notice, so it stays off —
# both have to be answered explicitly or pnpm fails the run with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  "@swc/core": true
  core-js: false

# Two dev-server / bundler transitives are held below their patched versions
# by their parents' declared ranges (copy-webpack-plugin 11 wants
# serialize-javascript ^6, sockjs wants uuid ^8). Both consumers only call
# `serialize(obj)` and `uuid.v4()`, which the patched majors keep. Drop an
# entry once @docusaurus/bundler / sockjs move their own range.
overrides:
  serialize-javascript: ^7.0.5
  uuid: ^11.1.1
