# Full A2Flow stack: PostgreSQL 17 + backend (FastAPI/ADK) + frontend (Next.js).
#
# Usage (Google AI Studio — default):
#   echo GOOGLE_API_KEY=<your-key> > .env
#   docker compose up --build
#
# Usage (OpenAI):
#   printf 'LLM_MODEL=litellm:openai/gpt-6.1-sol\nOPENAI_API_KEY=<your-key>\n' > .env
#   docker compose up --build
#
# Usage (Anthropic):
#   printf 'LLM_MODEL=litellm:anthropic/claude-sonnet-5-5\nANTHROPIC_API_KEY=<your-key>\n' > .env
#   docker compose up --build
#
# Usage (Amazon Bedrock):
#   printf 'LLM_MODEL=litellm:bedrock/global.anthropic.claude-sonnet-5-5\nAWS_BEARER_TOKEN_BEDROCK=<token>\n' > .env
#   docker compose up --build
#
# The app is served at http://localhost:3000 by default. The browser talks
# only to the `ingress` service (Envoy), which routes /api/* and
# /openapi.json to the backend and everything else to the frontend -- one
# origin, so the auth cookies stay same-origin, and the SSE streams never pass
# through Node.js. Set APP_PORT in .env to publish the app on a different host
# port; CORS_ORIGINS below follows it automatically. To serve it over HTTPS
# instead, add the Caddy front in compose.https.yml (see that file).
#
# Optional OpenBao (a Vault-compatible secret store) to try the Vault
# integration against, its data kept in the `db` service below:
#   docker compose --profile openbao up --build
# Its UI is then served at http://localhost:8200/ui (OPENBAO_PORT in .env to
# change the host port). See the manual's "Run with Docker Compose" page for
# initializing it and connecting A2Flow to it.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: a2flow
      POSTGRES_PASSWORD: a2flow
      POSTGRES_DB: a2flow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2flow -d a2flow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: backend
    environment:
      DB_URL: postgresql://a2flow:a2flow@db:5432/a2flow
      LLM_MODEL: ${LLM_MODEL:-gemini-3.8-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      # Password for the seeded 'root' user (holds super_admin). Optional: if
      # left unset, a random password is generated and printed once to
      # `docker compose logs backend` on first startup.
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}
      # Password for the seeded 'admin' user inside the seeded "Default"
      # tenant. Optional: same generate-and-log-once fallback as
      # ROOT_PASSWORD when unset.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Set DEMO_DATA=true to register the sample "launch an EC2 instance",
      # "restart a GKE pod", and "rotate a Key Vault secret" datasets
      # (secrets, AWS, GKE, and Azure MCP servers, agent skills,
      # approver/requester users) in the Default tenant on startup; unsetting
      # it removes those records again on the next startup.
      # DEMO_PASSWORD has the same generate-and-log-once fallback as the
      # passwords above. The AWS, Google Cloud, and Azure credentials are
      # optional -- a placeholder is stored when they are unset -- but note
      # the demo AWS, GKE, and Azure MCP servers can all run mutating
      # operations, not only reads.
      DEMO_DATA: ${DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_AWS_ACCESS_KEY_ID: ${DEMO_AWS_ACCESS_KEY_ID:-}
      DEMO_AWS_SECRET_ACCESS_KEY: ${DEMO_AWS_SECRET_ACCESS_KEY:-}
      DEMO_AWS_REGION: ${DEMO_AWS_REGION:-us-east-1}
      DEMO_GCP_CREDENTIALS_JSON: ${DEMO_GCP_CREDENTIALS_JSON:-}
      DEMO_AZURE_TENANT_ID: ${DEMO_AZURE_TENANT_ID:-}
      DEMO_AZURE_CLIENT_ID: ${DEMO_AZURE_CLIENT_ID:-}
      DEMO_AZURE_CLIENT_SECRET: ${DEMO_AZURE_CLIENT_SECRET:-}
      CORS_ORIGINS: http://localhost:${APP_PORT:-3000}
      # Store of cloned skill repositories, one directory per published
      # revision. Durable state, not a cache: a workflow execution pins the
      # revision it started with. Scaling the backend past one replica requires
      # every replica to mount this same volume (ReadWriteMany).
      SKILLS_DIR: /var/lib/a2flow/skills
      # The `worker` service below drains the outgoing-email queue, so the API
      # process does not. Leaving this on would be harmless -- the `email-queue`
      # advisory lock still elects one sender -- but it would put SMTP work in
      # the process serving requests.
      EMAIL_WORKER_IN_PROCESS: "false"
      # Reach registered MCP servers through the `mcp-proxy` service below
      # rather than from this container. Unset, the backend would launch them
      # itself -- which is what a local `uvicorn main:app` still does, and what
      # this deployment deliberately does not.
      MCP_PROXY_URL: https://mcp-proxy:8443
      # The backend issues the TLS material for that hop at startup: the root's
      # public certificate plus the proxy's server certificate and key go here,
      # where the proxy mounts them read-only.
      MCP_PROXY_TLS_DIR: /var/lib/a2flow/mcp-tls
      # Its own client identity goes somewhere the proxy cannot read. A
      # container path rather than a volume: it is reissued on every start that
      # finds it missing, so there is nothing to keep.
      MCP_BACKEND_TLS_DIR: /app/.mcp-tls-backend
      # The Fernet key that encrypts stored secrets and the approval CA's key.
      # Generated here on first start unless SECRET_ENCRYPTION_KEY is set, and
      # shared with `worker` through the `secret-key` volume -- never baked into
      # the image, and never mounted into `mcp-proxy`.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      SECRET_KEY_FILE: /var/lib/a2flow/secret-key/.secret_key
    # `default` reaches the database and serves the frontend; `mcp` is the one
    # network it shares with `mcp-proxy` (see the `networks` block below).
    networks:
      - default
      - mcp
    volumes:
      - skills:/var/lib/a2flow/skills
      - mcp-tls:/var/lib/a2flow/mcp-tls
      - secret-key:/var/lib/a2flow/secret-key
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # Delivers notification email: reads the `outbound_emails` queue the API
  # writes to, paces itself against the configured SMTP relay, and retries what
  # is worth retrying. Deliberately a separate process rather than a thread in
  # the API -- a hung relay then costs nothing that serves requests.
  #
  # Do not scale this past one replica expecting more throughput: they contend
  # on the `email-queue` advisory lock and all but one sit idle by design, which
  # is what keeps the rate limit exact. A second replica buys failover, not
  # capacity.
  worker:
    build:
      context: ./backend
      target: backend
    command: ["uv", "run", "--no-sync", "python", "-m", "worker"]
    environment:
      DB_URL: postgresql://a2flow:a2flow@db:5432/a2flow
      # Same key as the backend: the worker decrypts the SMTP password.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      SECRET_KEY_FILE: /var/lib/a2flow/secret-key/.secret_key
    volumes:
      - secret-key:/var/lib/a2flow/secret-key
    depends_on:
      # Not just for the database: the API applies the Alembic migrations and
      # seeds the settings row on startup, and the worker does neither. Waiting
      # for it to report healthy is what guarantees the schema is there.
      backend:
        condition: service_healthy

  # Runs the MCP servers a tenant has registered. They are third-party code --
  # a stdio server is launched here as a child process, a remote one is reached
  # from here over the network -- so the isolation is the point of the service,
  # and what it does *not* have is as deliberate as what it does: no DB_URL, no
  # secret encryption key, no Vault credentials, no LLM API keys, no skill
  # store. Everything it needs for one call arrives in that call.
  #
  # The channel from the backend is HTTPS with client authentication, and each
  # call additionally carries the task's tool certificate. See
  # backend/mcp_proxy/auth.py for what is checked and why both are needed.
  #
  # No published port: only the backend has any business reaching it.
  mcp-proxy:
    build:
      context: ./backend
      target: mcp-proxy
    command: ["uv", "run", "--no-sync", "python", "-m", "mcp_proxy"]
    environment:
      MCP_PROXY_TLS_DIR: /var/lib/a2flow/mcp-tls
      MCP_PROXY_PORT: "8443"
      # One home directory per tenant. Every stdio MCP server launch runs in
      # its own bubblewrap sandbox with its tenant's directory as HOME, so
      # package caches are never shared across tenants. The proxy refuses to
      # start without it.
      MCP_SANDBOX_DIR: /var/lib/a2flow/mcp-home
    # What bubblewrap needs to create the per-launch sandbox inside this
    # container: Docker's default seccomp and AppArmor profiles block the
    # user and mount namespaces it builds, and `systempaths` must be
    # unconfined for it to mount a fresh /proc (the one thing that keeps a
    # launch from reading another's environment). Loosened for this service
    # only, which in exchange isolates every launch from every other one.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    # Only `mcp`, never `default`: the code that runs here must not be able to
    # open a connection to `db` (or `worker`, or `frontend`) at all, whatever
    # credential it may know.
    networks:
      - mcp
    volumes:
      # Read-only: the backend issues this material, and nothing that runs in
      # here should be able to replace it.
      - mcp-tls:/var/lib/a2flow/mcp-tls:ro
      - mcp-home:/var/lib/a2flow/mcp-home
    healthcheck:
      # The listener demands a client certificate, so curl cannot probe it
      # without one. Checking that the port accepts a connection is what can be
      # established from inside the container.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket;socket.create_connection(('127.0.0.1',8443),2).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      # Waits for the certificate, not for the database: the backend writes the
      # TLS material during startup, before it reports healthy. The reverse edge
      # is deliberately absent -- it would be a cycle, and the backend does not
      # call the proxy until an agent run asks it to.
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Internal Docker network address of the backend service above, on its
      # Dockerfile-hardcoded port 8000. Unlike APP_PORT this never varies by
      # deployment, so it's a plain literal rather than a ${VAR:-default} host
      # override -- same style as DB_URL. Browser /api/* requests never get
      # here (`ingress` sends them to the backend); this is for the frontend's
      # own server-side calls, such as the API doc page's session check.
      BACKEND_BASE_URL: http://backend:8000
    # No published port: the browser reaches it through `ingress`.
    depends_on:
      backend:
        condition: service_healthy

  # The one published entry point. Routes by path on a single origin: /api/*
  # and /openapi.json to the backend, everything else to the frontend. Keeping
  # the long-lived SSE streams off the frontend is the point -- otherwise every
  # open chat would hold a socket on the Node.js server. A production ingress
  # or load balancer should route the same way; see the manual's Deployment
  # page. No admin interface: nothing here needs it, and it must not be public.
  ingress:
    image: envoyproxy/envoy:distroless-v1.40.2
    configs:
      - source: envoy
        target: /etc/envoy/envoy.yaml
    ports:
      - "${APP_PORT:-3000}:8080"
    depends_on:
      - backend
      - frontend

  # Creates the `openbao` database in `db` for the OpenBao service below, then
  # exits. A job rather than an init script because postgres runs those only on
  # an empty `pgdata` volume. A database of its own, not a table in `a2flow`, so
  # Alembic autogenerate never sees OpenBao's table and proposes dropping it.
  openbao-db-init:
    profiles: ["openbao"]
    image: postgres:17
    environment:
      PGHOST: db
      PGUSER: a2flow
      PGPASSWORD: a2flow
      PGDATABASE: a2flow
    command:
      [
        "sh",
        "-c",
        "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = 'openbao'\" | grep -q 1 || psql -c 'CREATE DATABASE openbao'",
      ]
    depends_on:
      db:
        condition: service_healthy

  # OpenBao, an API-compatible Vault fork, for trying `vault`-type secrets
  # locally. Opt-in (`--profile openbao`). Its storage is the `openbao`
  # database in `db`, so it is backed up with `pgdata`; it creates its
  # `openbao_kv_store` table itself.
  #
  # It unseals itself on every start with the `static` seal, whose key is
  # generated into the `openbao-unseal` volume on first start. Anyone holding
  # that key and the database can read every secret, and losing the key makes
  # the data unreadable -- fine for a local trial, not for production.
  openbao:
    profiles: ["openbao"]
    image: openbao/openbao:2.7.2
    entrypoint:
      [
        "sh",
        "-c",
        "[ -s /openbao/file/unseal.key ] || head -c 32 /dev/urandom > /openbao/file/unseal.key; exec docker-entrypoint.sh server",
      ]
    environment:
      # For the `bao` CLI run through `docker compose exec openbao`.
      BAO_ADDR: http://127.0.0.1:8200
    configs:
      - source: openbao
        target: /openbao/config/config.hcl
    volumes:
      - openbao-unseal:/openbao/file
    # Published so its UI can be opened from the host. The backend reaches it
    # as http://openbao:8200 on `default`; it never joins `mcp`.
    ports:
      - "${OPENBAO_PORT:-8200}:8200"
    depends_on:
      openbao-db-init:
        condition: service_completed_successfully

configs:
  # Routes are matched in order. The /api/ route disables both the route
  # timeout (15 s by default) and the stream idle timeout (5 min by default):
  # an agent run has no server-side time limit, and either default would cut
  # an SSE stream off mid-turn. Envoy neither buffers nor compresses responses
  # unless told to, so the streams need nothing else. /api-doc does not match
  # the /api/ prefix and goes to the frontend, which serves that page.
  envoy:
    content: |
      static_resources:
        listeners:
          - name: ingress
            address:
              socket_address: { address: 0.0.0.0, port_value: 8080 }
            filter_chains:
              - filters:
                  - name: envoy.filters.network.http_connection_manager
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                      stat_prefix: ingress
                      route_config:
                        virtual_hosts:
                          - name: a2flow
                            domains: ["*"]
                            routes:
                              - match: { prefix: "/api/" }
                                route: { cluster: backend, timeout: 0s, idle_timeout: 0s }
                              - match: { path: "/openapi.json" }
                                route: { cluster: backend }
                              - match: { prefix: "/" }
                                route: { cluster: frontend }
                      http_filters:
                        - name: envoy.filters.http.router
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        clusters:
          - name: backend
            type: STRICT_DNS
            load_assignment:
              cluster_name: backend
              endpoints:
                - lb_endpoints:
                    - endpoint:
                        address:
                          socket_address: { address: backend, port_value: 8000 }
          - name: frontend
            type: STRICT_DNS
            load_assignment:
              cluster_name: frontend
              endpoints:
                - lb_endpoints:
                    - endpoint:
                        address:
                          socket_address: { address: frontend, port_value: 3000 }
  openbao:
    content: |
      ui = true
      api_addr = "http://openbao:8200"
      storage "postgresql" {
        connection_url = "postgres://a2flow:a2flow@db:5432/openbao?sslmode=disable"
      }
      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = true
      }
      seal "static" {
        current_key_id = "compose-1"
        current_key    = "file:///openbao/file/unseal.key"
      }

networks:
  # The backend <-> mcp-proxy hop, kept apart from `default` so the third-party
  # MCP server code in `mcp-proxy` cannot reach `db`. Not `internal`: remote MCP
  # servers, and the packages stdio servers fetch at launch, are on the internet.
  mcp:

volumes:
  pgdata:
  skills:
  mcp-tls:
  mcp-home:
  secret-key:
  openbao-unseal:
