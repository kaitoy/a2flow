# Full A2Flow stack: PostgreSQL 17 + backend (FastAPI/ADK) + frontend (Next.js).
#
# Usage (Google AI Studio — default):
#   echo GOOGLE_API_KEY=<your-key> > .env
#   docker compose up --build
#
# Usage (OpenAI):
#   printf 'LLM_MODEL=litellm:openai/gpt-4o\nOPENAI_API_KEY=<your-key>\n' > .env
#   docker compose up --build
#
# Usage (Anthropic):
#   printf 'LLM_MODEL=litellm:anthropic/claude-3-5-sonnet-20241022\nANTHROPIC_API_KEY=<your-key>\n' > .env
#   docker compose up --build
#
# Usage (Amazon Bedrock):
#   printf 'LLM_MODEL=litellm:bedrock/global.anthropic.claude-sonnet-4-6\nAWS_BEARER_TOKEN_BEDROCK=<token>\n' > .env
#   docker compose up --build
#
# The app is served at http://localhost:3000 by default. The browser talks
# only to the frontend; its server-side proxy (frontend/src/proxy.ts) forwards
# /api/* to the backend, keeping the auth cookies same-origin. Set
# FRONTEND_PORT in .env to publish the frontend on a different host port (the
# container keeps listening on 3000 internally); CORS_ORIGINS below follows
# it automatically.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: a2flow
      POSTGRES_PASSWORD: a2flow
      POSTGRES_DB: a2flow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2flow -d a2flow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: backend
    environment:
      DB_URL: postgresql://a2flow:a2flow@db:5432/a2flow
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      # Password for the seeded 'root' user (holds super_admin). Optional: if
      # left unset, a random password is generated and printed once to
      # `docker compose logs backend` on first startup.
      ROOT_PASSWORD: ${ROOT_PASSWORD:-}
      # Password for the seeded 'admin' user inside the seeded "Default"
      # tenant. Optional: same generate-and-log-once fallback as
      # ROOT_PASSWORD when unset.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Set DEMO_DATA=true to register the sample "launch an EC2 instance"
      # dataset (secrets, AWS MCP server, agent skill, approver/requester
      # users) in the Default tenant on startup; unsetting it removes those
      # records again on the next startup. DEMO_PASSWORD has the same
      # generate-and-log-once fallback as the passwords above. The AWS
      # credentials are optional -- a placeholder is stored when they are
      # unset -- but note the demo MCP server can run mutating AWS
      # operations, not only reads.
      DEMO_DATA: ${DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_AWS_ACCESS_KEY_ID: ${DEMO_AWS_ACCESS_KEY_ID:-}
      DEMO_AWS_SECRET_ACCESS_KEY: ${DEMO_AWS_SECRET_ACCESS_KEY:-}
      DEMO_AWS_REGION: ${DEMO_AWS_REGION:-us-east-1}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      # Store of cloned skill repositories, one directory per published
      # revision. Durable state, not a cache: a workflow execution pins the
      # revision it started with. Scaling the backend past one replica requires
      # every replica to mount this same volume (ReadWriteMany).
      SKILLS_DIR: /var/lib/a2flow/skills
      # The `worker` service below drains the outgoing-email queue, so the API
      # process does not. Leaving this on would be harmless -- the `email-queue`
      # advisory lock still elects one sender -- but it would put SMTP work in
      # the process serving requests.
      EMAIL_WORKER_IN_PROCESS: "false"
      # Reach registered MCP servers through the `mcp-proxy` service below
      # rather than from this container. Unset, the backend would launch them
      # itself -- which is what a local `uvicorn main:app` still does, and what
      # this deployment deliberately does not.
      MCP_PROXY_URL: https://mcp-proxy:8443
      # The backend issues the TLS material for that hop at startup: the root's
      # public certificate plus the proxy's server certificate and key go here,
      # where the proxy mounts them read-only.
      MCP_PROXY_TLS_DIR: /var/lib/a2flow/mcp-tls
      # Its own client identity goes somewhere the proxy cannot read. A
      # container path rather than a volume: it is reissued on every start that
      # finds it missing, so there is nothing to keep.
      MCP_BACKEND_TLS_DIR: /app/.mcp-tls-backend
    volumes:
      - skills:/var/lib/a2flow/skills
      - mcp-tls:/var/lib/a2flow/mcp-tls
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  # Delivers notification email: reads the `outbound_emails` queue the API
  # writes to, paces itself against the configured SMTP relay, and retries what
  # is worth retrying. Deliberately a separate process rather than a thread in
  # the API -- a hung relay then costs nothing that serves requests.
  #
  # Do not scale this past one replica expecting more throughput: they contend
  # on the `email-queue` advisory lock and all but one sit idle by design, which
  # is what keeps the rate limit exact. A second replica buys failover, not
  # capacity.
  worker:
    build:
      context: ./backend
      target: backend
    command: ["uv", "run", "--no-sync", "python", "-m", "worker"]
    environment:
      DB_URL: postgresql://a2flow:a2flow@db:5432/a2flow
    depends_on:
      # Not just for the database: the API applies the Alembic migrations and
      # seeds the settings row on startup, and the worker does neither. Waiting
      # for it to report healthy is what guarantees the schema is there.
      backend:
        condition: service_healthy

  # Runs the MCP servers a tenant has registered. They are third-party code --
  # a stdio server is launched here as a child process, a remote one is reached
  # from here over the network -- so the isolation is the point of the service,
  # and what it does *not* have is as deliberate as what it does: no DB_URL, no
  # secret encryption key, no Vault credentials, no LLM API keys, no skill
  # store. Everything it needs for one call arrives in that call.
  #
  # The channel from the backend is HTTPS with client authentication, and each
  # call additionally carries the task's tool certificate. See
  # backend/mcp_proxy/auth.py for what is checked and why both are needed.
  #
  # No published port: only the backend has any business reaching it.
  mcp-proxy:
    build:
      context: ./backend
      target: mcp-proxy
    command: ["uv", "run", "--no-sync", "python", "-m", "mcp_proxy"]
    environment:
      MCP_PROXY_TLS_DIR: /var/lib/a2flow/mcp-tls
      MCP_PROXY_PORT: "8443"
    volumes:
      # Read-only: the backend issues this material, and nothing that runs in
      # here should be able to replace it.
      - mcp-tls:/var/lib/a2flow/mcp-tls:ro
    healthcheck:
      # The listener demands a client certificate, so curl cannot probe it
      # without one. Checking that the port accepts a connection is what can be
      # established from inside the container.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket;socket.create_connection(('127.0.0.1',8443),2).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      # Waits for the certificate, not for the database: the backend writes the
      # TLS material during startup, before it reports healthy. The reverse edge
      # is deliberately absent -- it would be a cycle, and the backend does not
      # call the proxy until an agent run asks it to.
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Internal Docker network address of the backend service above, on its
      # Dockerfile-hardcoded port 8000. Unlike FRONTEND_PORT this never varies
      # by deployment, so it's a plain literal rather than a ${VAR:-default}
      # host override -- same style as DB_URL.
      BACKEND_BASE_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  skills:
  mcp-tls:
